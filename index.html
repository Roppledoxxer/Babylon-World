<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Babylon World — Alpha (NPCs match player + health + cars)</title>
  <link rel="icon" type="image/png" href="Ignited fuse with fiery explosion.png">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #87CEEB;
      font-family: Inter, system-ui, Arial, sans-serif;
    }
    #renderCanvas { width:100%; height:100%; touch-action:none; display:block; }
    #hudHotbar { position: absolute; bottom: 22px; right: 22px; display:flex; gap:8px; z-index:9999; user-select:none; }
    .hotbar-slot { width:64px; height:48px; border-radius:8px; border:1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.25); color: white; display:flex; align-items:center; justify-content:center; flex-direction: column; font-size:18px; cursor:pointer; }
    .hotbar-slot.active { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.22); }
    #hint { position:absolute; left:20px; bottom:22px; color:white; z-index:9999; background: rgba(0,0,0,0.22); padding:8px 10px; border-radius:8px; font-family:monospace; font-size:13px; }
  </style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="hudHotbar"></div>
<div id="hint">1: Sword  •  2: Bomb  •  3: Block  •  4: NPC Spawner  •  Left-click to use • Mousewheel to switch</div>

<!-- Babylon + GUI -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

<script>
(() => {
  try {
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: false, stencil: true });
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color3(0.53, 0.81, 0.92);

    // ---------- GUI (fullscreen) ----------
    const ui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

    /* ---------------------------
       CAMERA + LIGHT
       --------------------------- */
    const camera = new BABYLON.FollowCamera("cam", new BABYLON.Vector3(0, 12, -30), scene);
    camera.radius = 24;
    camera.heightOffset = 8;
    camera.rotationOffset = 180;
    camera.attachControl(canvas, true);

    const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.4, -1, -0.3), scene);
    sun.intensity = 0.7;
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
    hemi.intensity = 0.35;

    /* ---------------------------
       SKY + CLOUDS
       --------------------------- */
    const sky = BABYLON.MeshBuilder.CreateSphere("sky", { diameter: 1000 }, scene);
    const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
    skyMat.backFaceCulling = false;
    skyMat.emissiveColor = new BABYLON.Color3(0.53, 0.81, 0.92);
    sky.material = skyMat;

    const cloudTex = new BABYLON.DynamicTexture("clouds", 512, scene);
    const ctxCloud = cloudTex.getContext();
    ctxCloud.clearRect(0,0,512,512);
    ctxCloud.fillStyle = "rgba(255,255,255,0.72)";
    for (let i=0;i<40;i++){
      ctxCloud.beginPath();
      ctxCloud.arc(Math.random()*512, Math.random()*512, 40+Math.random()*30, 0, Math.PI*2);
      ctxCloud.fill();
    }
    cloudTex.update();
    const cloudMat = new BABYLON.StandardMaterial("cloudMat", scene);
    cloudMat.opacityTexture = cloudTex;
    cloudMat.diffuseColor = BABYLON.Color3.White();
    cloudMat.backFaceCulling = false;
    cloudMat.disableLighting = true;
    const clouds = BABYLON.MeshBuilder.CreatePlane("clouds", { size: 600 }, scene);
    clouds.rotation.x = Math.PI/2;
    clouds.position.y = 220;
    clouds.material = cloudMat;

    /* ---------------------------
       GROUND + GRASS TEXTURE
       --------------------------- */
    const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 1000, height: 1000 }, scene);
    const TILE_SIZE = 512;
    const tileTex = new BABYLON.DynamicTexture("grassTile", { width: TILE_SIZE, height: TILE_SIZE }, scene, false);
    const tctx = tileTex.getContext();
    const tw = TILE_SIZE, th = TILE_SIZE;
    const bright = "#39ff33";
    tctx.fillStyle = bright;
    tctx.fillRect(0,0,tw,th);
    const gridCount = 4;
    const cellW = Math.floor(tw / gridCount);
    const cellH = Math.floor(th / gridCount);
    const inset = 4;
    for (let gx=0; gx<gridCount; gx++){
      for (let gy=0; gy<gridCount; gy++){
        if ((gx+gy)%2===0 || Math.random() < 0.25) {
          const gVal = 192 + Math.floor(Math.random()*24);
          const rVal = 40 + Math.floor(Math.random()*10);
          const bVal = 36 + Math.floor(Math.random()*10);
          tctx.fillStyle = `rgb(${rVal},${gVal},${bVal})`;
          const x = gx*cellW + inset;
          const y = gy*cellH + inset;
          tctx.fillRect(x,y,cellW-inset*2,cellH-inset*2);
          const cx = x + (cellW-inset*2)/2;
          const cy = y + (cellH-inset*2)/2;
          const rad = Math.max(cellW,cellH)*0.6;
          const grd = tctx.createRadialGradient(cx,cy,1,cx,cy,rad);
          grd.addColorStop(0,'rgba(0,0,0,0.0)');
          grd.addColorStop(1,'rgba(0,0,0,0.06)');
          tctx.fillStyle = grd;
          tctx.fillRect(x,y,cellW-inset*2,cellH-inset*2);
        }
      }
    }
    const img = tctx.getImageData(0,0,tw,th);
    for (let i=0;i<img.data.length;i+=4) {
      const n = (Math.random()-0.5)*8;
      img.data[i] = Math.max(0, Math.min(255, img.data[i] + n));
      img.data[i+1] = Math.max(0, Math.min(255, img.data[i+1] + n));
      img.data[i+2] = Math.max(0, Math.min(255, img.data[i+2] + n));
    }
    tctx.putImageData(img,0,0);
    tileTex.update();
    tileTex.wrapU = tileTex.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
    const grassMat = new BABYLON.StandardMaterial("grass", scene);
    grassMat.diffuseTexture = tileTex;
    grassMat.diffuseTexture.uScale = grassMat.diffuseTexture.vScale = 20;
    grassMat.specularColor = new BABYLON.Color3(0,0,0);
    ground.material = grassMat;

    /* ---------------------------
       particle texture (simple dynamic circular texture)
       --------------------------- */
    const particleTex = new BABYLON.DynamicTexture('particleTex', 64, scene, false);
    const pctx = particleTex.getContext();
    pctx.clearRect(0,0,64,64);
    const grad = pctx.createRadialGradient(32,32,2,32,32,30);
    grad.addColorStop(0,'rgba(255,255,255,1)');
    grad.addColorStop(0.6,'rgba(255,255,255,0.6)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    pctx.fillStyle = grad;
    pctx.fillRect(0,0,64,64);
    particleTex.update();

    /* ---------------------------
       PLAYER (R6-like)
       --------------------------- */
    const player = new BABYLON.TransformNode("player", scene);
    const GROUNDED_Y = 3; // player's ground half-height used for both player & NPCs
    player.position.y = GROUNDED_Y;

    const torso = BABYLON.MeshBuilder.CreateBox("torso", { width:2, height:2, depth:1 }, scene);
    torso.parent = player; torso.position.set(0,0,0);
    const head = BABYLON.MeshBuilder.CreateBox("head", { size:1.5 }, scene); head.parent = torso; head.position.set(0,1.8,0);

    const leftArm = BABYLON.MeshBuilder.CreateBox("lArm", { height:2, width:0.8, depth:0.8 }, scene);
    leftArm.setPivotPoint(new BABYLON.Vector3(0,1,0));
    leftArm.parent = torso; leftArm.position.set(-1.4,0,0);

    const rightArm = leftArm.clone("rArm"); // cloned to match the same pivot/size
    rightArm.setPivotPoint(new BABYLON.Vector3(0,1,0)); rightArm.parent = torso; rightArm.position.set(1.4,0,0);

    const leftLeg = BABYLON.MeshBuilder.CreateBox("lLeg", { height:2, width:0.9, depth:0.9 }, scene);
    leftLeg.setPivotPoint(new BABYLON.Vector3(0,1,0)); leftLeg.parent = torso; leftLeg.position.set(-0.5,-1.9,0);

    const rightLeg = leftLeg.clone("rLeg"); rightLeg.setPivotPoint(new BABYLON.Vector3(0,1,0)); rightLeg.parent = torso; rightLeg.position.set(0.5,-1.9,0);

    const bodyMat = new BABYLON.StandardMaterial("body", scene); bodyMat.diffuseColor = new BABYLON.Color3(1,1,1);
    [torso, head, leftArm, rightArm, leftLeg, rightLeg].forEach(m=>m.material = bodyMat);
    camera.lockedTarget = torso;

    /* ---------------------------
       POINTER LOCK + MOUSE LOOK
       --------------------------- */
    canvas.addEventListener("click", () => {
      canvas.requestPointerLock = canvas.requestPointerLock || canvas.msRequestPointerLock || canvas.mozRequestPointerLock || canvas.webkitRequestPointerLock;
      if (canvas.requestPointerLock) canvas.requestPointerLock();
    });
    let mouseSensitivity = 0.0025;
    scene.onPointerObservable.add((pointerInfo) => {
      if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERMOVE) {
        if (document.pointerLockElement === canvas) {
          const evt = pointerInfo.event;
          const dx = evt.movementX || 0;
          const dy = evt.movementY || 0;
          player.rotation.y += dx * mouseSensitivity;
          camera.heightOffset -= dy * 0.05;
          camera.heightOffset = BABYLON.Scalar.Clamp(camera.heightOffset, 4, 14);
        }
      }
    });

    /* ---------------------------
       INPUTS
       --------------------------- */
    const input = {};
    let nearCar = null; // used for 'E to get in' detection
    scene.onKeyboardObservable.add(kb => {
      const key = (kb.event && (kb.event.code || kb.event.key)) ? (kb.event.code || kb.event.key) : '';
      const keyLower = (kb.event && kb.event.key) ? kb.event.key.toLowerCase() : key;
      if (kb.type === BABYLON.KeyboardEventTypes.KEYDOWN) {
        if (key === "Space" || keyLower === " ") input[" "] = true;
        input[keyLower] = true;
        if (key === "Digit1") setActiveIndex(0);
        if (key === "Digit2") setActiveIndex(1);
        if (key === "Digit3") setActiveIndex(2);
        if (key === "Digit4") setActiveIndex(3);
        if (keyLower === "f") attemptUse();
        if (keyLower === "g") attemptUse();
        if (keyLower === "e") {
          // Enter/exit car if near
          if (playerCar) {
            exitCar();
          } else if (nearCar) {
            enterCar(nearCar);
          }
        }
      } else if (kb.type === BABYLON.KeyboardEventTypes.KEYUP) {
        if (key === "Space" || keyLower === " ") input[" "] = false;
        input[keyLower] = false;
      }
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (e.deltaY > 0) setActiveIndex((activeIndex + 1) % inventory.length);
      else setActiveIndex((activeIndex - 1 + inventory.length) % inventory.length);
    }, { passive:false });

    /* ---------------------------
       WORLD: HOUSE, PLATFORMS
       --------------------------- */
    const houseRoot = new BABYLON.TransformNode("houseRoot", scene);
    const wallMat = new BABYLON.StandardMaterial("wallMat", scene); wallMat.diffuseColor = new BABYLON.Color3(0.95,0.9,0.8);
    const roofMat = new BABYLON.StandardMaterial("roofMat", scene); roofMat.diffuseColor = new BABYLON.Color3(0.55,0.12,0.12);
    const doorMat = new BABYLON.StandardMaterial("doorMat", scene); doorMat.diffuseColor = new BABYLON.Color3(0.4,0.2,0.1);

    const houseWidth = 40, houseDepth = 28, wallHeight = 10;
    const houseX = 60, houseZ = -30, houseY = 0.25;
    const houseFloor = BABYLON.MeshBuilder.CreateBox("houseFloor", { width:houseWidth, depth:houseDepth, height:0.6 }, scene);
    houseFloor.position.set(houseX, houseY - 0.3, houseZ); houseFloor.material = wallMat; houseFloor.parent = houseRoot;

    const thickness = 0.5, doorWidth=4.0, halfWallWidth=(houseWidth-doorWidth)/2;
    const frontLeft = BABYLON.MeshBuilder.CreateBox("houseWallFrontLeft", { width:halfWallWidth, height:wallHeight, depth:thickness }, scene);
    frontLeft.position.set(houseX - (doorWidth + halfWallWidth)/2, wallHeight/2 + houseY, houseZ - houseDepth/2 + thickness/2); frontLeft.material = wallMat; frontLeft.parent = houseRoot;
    const frontRight = BABYLON.MeshBuilder.CreateBox("houseWallFrontRight", { width:halfWallWidth, height:wallHeight, depth:thickness }, scene);
    frontRight.position.set(houseX + (doorWidth + halfWallWidth)/2, wallHeight/2 + houseY, houseZ - houseDepth/2 + thickness/2); frontRight.material = wallMat; frontRight.parent = houseRoot;
    const backWall = BABYLON.MeshBuilder.CreateBox("houseWallBack", { width:houseWidth, height:wallHeight, depth:thickness }, scene);
    backWall.position.set(houseX, wallHeight/2 + houseY, houseZ + houseDepth/2 - thickness/2); backWall.material = wallMat; backWall.parent = houseRoot;
    const leftWall = BABYLON.MeshBuilder.CreateBox("houseWallLeft", { width:thickness, height:wallHeight, depth:houseDepth }, scene);
    leftWall.position.set(houseX - houseWidth/2 + thickness/2, wallHeight/2 + houseY, houseZ); leftWall.material = wallMat; leftWall.parent = houseRoot;
    const rightWall = leftWall.clone("houseWallRight"); rightWall.position.set(houseX + houseWidth/2 - thickness/2, wallHeight/2 + houseY, houseZ); rightWall.parent = houseRoot;

    const doorFrame = BABYLON.MeshBuilder.CreatePlane("doorFrame", { width:doorWidth, height:3.2 }, scene);
    doorFrame.position.set(houseX, 1.6 + houseY, houseZ - houseDepth/2 + 0.02); doorFrame.rotation.y = Math.PI; doorFrame.material = doorMat; doorFrame.parent = houseRoot;

    const roof = BABYLON.MeshBuilder.CreateBox("houseRoof", { width: houseWidth * 1.1, depth: houseDepth * 1.1, height: 0.6 }, scene);
    roof.position.set(houseX, wallHeight + houseY + 0.3, houseZ); roof.material = roofMat;

    const windowMat = new BABYLON.StandardMaterial("windowMat", scene); windowMat.diffuseColor = new BABYLON.Color3(0.2,0.5,0.9); windowMat.alpha = 0.7;
    const win1 = BABYLON.MeshBuilder.CreatePlane("window1", { width:2.6, height:2 }, scene); win1.position.set(houseX - 10, 4.2 + houseY, houseZ - houseDepth/2 + 0.02); win1.rotation.y = Math.PI; win1.material = windowMat; win1.parent = houseRoot;
    const win2 = win1.clone("window2"); win2.position.set(houseX + 10, 4.2 + houseY, houseZ - houseDepth/2 + 0.02); win2.parent = houseRoot;

    const table = BABYLON.MeshBuilder.CreateBox("table", { width:4, depth:2.2, height:0.4 }, scene); table.position.set(houseX, houseY + 0.45, houseZ); const tableMat = new BABYLON.StandardMaterial("tableMat", scene); tableMat.diffuseColor = new BABYLON.Color3(0.55,0.35,0.15); table.material = tableMat; table.parent = houseRoot;

    /* ---------------------------
       PARKOUR PLATFORMS
       --------------------------- */
    const platformMat = new BABYLON.StandardMaterial("platformMat", scene); platformMat.diffuseColor = new BABYLON.Color3(0.2,0.2,0.25); platformMat.specularColor = new BABYLON.Color3(0.1,0.1,0.1);
    const platforms = []; const startZ = -6;
    for (let i=0;i<12;i++){
      const pw = 3 + Math.random()*2, pd = 3 + Math.random()*2, ph = 0.6;
      const px = (Math.random()-0.5)*12; const pz = startZ - i*12;
      let py = 1.2 + i*1.1;
      if (i % 4 === 0) py += 2.0 + Math.random()*2.0;
      if (i === 11) py += 3;
      const plat = BABYLON.MeshBuilder.CreateBox(`platform_${i}`, { width:pw, depth:pd, height:ph }, scene);
      plat.position.set(px, py, pz); plat.material = platformMat; platforms.push(plat);
    }
    for (let j=0;j<4;j++){
      const pw=1.2, pd=1.2, ph=0.6; const px=-12 + j*6; const pz = -120 - j*12; const py = 6 + j*1.8;
      const plat = BABYLON.MeshBuilder.CreateBox(`pillar_${j}`, { width:pw, depth:pd, height:ph }, scene);
      plat.position.set(px, py, pz); plat.material = platformMat; platforms.push(plat);
    }
    const challenge = BABYLON.MeshBuilder.CreateBox("platform_challenge", { width:10, depth:10, height:0.8 }, scene);
    challenge.position.set(houseX + 28, 6.0, houseZ - 2); challenge.material = platformMat;

    /* ---------------------------
       solidSurfaces used for AABB land detection
       --------------------------- */
    const solidSurfaces = [ground, houseFloor, challenge, roof];
    platforms.forEach(p => solidSurfaces.push(p));
    solidSurfaces.push(frontLeft, frontRight, backWall, leftWall, rightWall);

    /* ---------------------------
       PHYSICS-LIKE VARS (movement)
       --------------------------- */
    let velocityY = 0;
    const GRAVITY = -20;
    let grounded = false;
    let prevFeetY = player.position.y - GROUNDED_Y;
    let walkTime = 0;

    /* ---------------------------
       WEAPONS / ITEMS / HUD
       --------------------------- */
    const hudHotbar = document.getElementById("hudHotbar");
    const inventory = [
      { id: "sword", label: "🗡️", count: Infinity, tooltip: "Sword — melee" },
      { id: "bomb", label: "💣", count: Infinity, tooltip: "Bomb — throw" },
      { id: "block", label: "▦", count: Infinity, tooltip: "Place block" },
      { id: "spawner", label: "👤+", count: Infinity, tooltip: "Spawn NPC" }
    ];
    let activeIndex = 0;
    function buildHotbar(){
      hudHotbar.innerHTML = "";
      inventory.forEach((it, i) => {
        const slot = document.createElement("div");
        slot.className = "hotbar-slot" + (i===activeIndex ? " active" : "");
        slot.title = it.tooltip;
        slot.innerHTML = `<div style="pointer-events:none">${it.label}</div><div style="font-size:12px;margin-top:3px;opacity:0.9">${isFinite(it.count) ? it.count : ""}</div>`;
        slot.onclick = () => setActiveIndex(i);
        hudHotbar.appendChild(slot);
      });
    }
    buildHotbar();
    function setActiveIndex(i){ activeIndex = i; buildHotbar(); updateHeldItem(); }

    // create sword mesh (attached to rightArm)
    const sword = BABYLON.MeshBuilder.CreateBox("sword", { width:0.25, height:3, depth:0.5 }, scene);
    const swordMat = new BABYLON.StandardMaterial("swordMat", scene); swordMat.diffuseColor = new BABYLON.Color3(0.85,0.85,0.9); sword.material = swordMat;
    sword.parent = rightArm; sword.position.set(0, -1, 0.6); sword.rotation.x = Math.PI/2;

    // default arm/sword rotations for animation restore
    const defaultRightArmRot = rightArm.rotation.clone();
    const defaultSwordRot = sword.rotation.clone();

    // sword animation state
    let swordSwing = false;
    let swordTimer = 0;
    const SWORD_SWING_TIME = 0.42;

    // bombs
    const bombs = [];
    const bombMat = new BABYLON.StandardMaterial("bombMat", scene); bombMat.diffuseColor = new BABYLON.Color3(0.08,0.08,0.08);

    // helpers
    function lerp(a,b,t){ return a + (b-a)*t; }
    function easeInOut(t){ return t<0.5 ? 2*t*t : -1 + (4-2*t)*t; }

    // angle helpers for NPC facing
    function wrapAngle(a) { a = (a + Math.PI) % (Math.PI * 2); if (a < 0) a += Math.PI * 2; return a - Math.PI; }
    function shortestAngleDelta(from, to) { return wrapAngle(to - from); }
    const NPC_TURN_SPEED = 6.0; // radians/sec - tweak to taste

    // ---------- Health UI helpers ----------
    function createNpcHealthBar(n) {
      if (!n) return;
      const w = 64;
      const bg = new BABYLON.GUI.Rectangle();
      bg.width = w + "px";
      bg.height = "8px";
      bg.cornerRadius = 4;
      bg.color = "black";
      bg.thickness = 1;
      bg.background = "rgba(0,0,0,0.6)";
      bg.isHitTestVisible = false;

      const fill = new BABYLON.GUI.Rectangle();
      fill.width = (w) + "px";
      fill.height = "100%";
      fill.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
      fill.cornerRadius = 3;
      fill.isHitTestVisible = false;
      fill.paddingLeft = "0px";
      fill.background = "green";

      bg.addControl(fill);
      ui.addControl(bg);
      n.healthBar = { bg, fill, width: w };
    }

    function updateNpcHealthBar(n) {
      if (!n || !n.healthBar || !n.torso) return;
      const headWorldPos = n.torso.getAbsolutePosition().add(new BABYLON.Vector3(0, 1.5, 0));
      const proj = BABYLON.Vector3.Project(headWorldPos, BABYLON.Matrix.Identity(), scene.getTransformMatrix(), camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight()));
      if (!isFinite(proj.x) || !isFinite(proj.y)) {
        n.healthBar.bg.isVisible = false;
        return;
      }
      n.healthBar.bg.isVisible = true;
      n.healthBar.bg.left = proj.x - engine.getRenderWidth()/2 + "px";
      n.healthBar.bg.top  = proj.y - engine.getRenderHeight()/2 - 30 + "px";
      const pct = Math.max(0, Math.min(1, (n.health || n.maxHealth) / (n.maxHealth || 100)));
      const px = Math.max(0, Math.floor(n.healthBar.width * pct));
      n.healthBar.fill.width = px + "px";
      // color transition green -> yellow -> red
      if (pct > 0.6) n.healthBar.fill.background = "green";
      else if (pct > 0.25) n.healthBar.fill.background = "yellow";
      else n.healthBar.fill.background = "red";
    }

    // ---------- NPC damage / ragdoll / despawn ----------
    function damageNpc(n, dmg) {
      if (!n || n.ragdoll) return;
      if (typeof n.health !== "number") n.health = n.maxHealth || 100;
      n.health -= dmg;
      if (n.health <= 0) {
        n.health = 0;
        // go ragdoll instead of immediate removal
        killNpc(n);
      }
    }

    function killNpc(n) {
      if (!n || n.ragdoll) return;
      n.ragdoll = true;
      n.state = "dead";
      n.dest = null;
      n.ragdollDeathTime = Date.now();
      if (n.velocity && typeof n.velocity.copyFrom === "function") n.velocity.copyFrom(BABYLON.Vector3.Zero());
      // upward toss & random horizontal knockback
      n.velocityY = 6 + Math.random()*5;
      const dir = new BABYLON.Vector3(Math.random()-0.5, 0, Math.random()-0.5);
      dir.normalize();
      n.ragdollVel = dir.scale(8 + Math.random()*6);
      n.ragdollAng = {
        la: (Math.random()-0.5)*8,
        ra: (Math.random()-0.5)*8,
        ll: (Math.random()-0.5)*8,
        rl: (Math.random()-0.5)*8
      };
      // keep health bar visible until despawn; optionally fade out later
    }

    function disposeNpc(n) {
      try {
        if (n.healthBar) {
          try { ui.removeControl(n.healthBar.bg); } catch(e) {}
          n.healthBar = null;
        }
        n.root.getChildren().forEach(c => { try { c.dispose(); } catch(e){} });
        n.root.dispose();
      } catch(e){}
      const idx = npcs.indexOf(n);
      if (idx >= 0) npcs.splice(idx, 1);
    }

    // blocks placed
    function spawnBlockAt(pos, size=1.4){
      const box = BABYLON.MeshBuilder.CreateBox(`placed_block_${Date.now()}`, { width:size, depth:size, height:size }, scene);
      const mat = new BABYLON.StandardMaterial("placedBlockMat", scene);
      mat.diffuseColor = new BABYLON.Color3(0.16,0.7,0.2);
      box.material = mat;
      box.position = pos.clone();
      box.position.y += size/2;
      solidSurfaces.push(box);
      return box;
    }

    // NPCs
    const npcs = [];

    // IMPORTANT: make NPCs use the exact same model/joint placement & speed as player

      }

        const sz = 1 + Math.random() * (radius * 1);
        const s = BABYLON.MeshBuilder.CreateBox(`smoke_${Date.now()}_${i}`, { size: sz }, scene);
        const sm = new BABYLON.StandardMaterial(`smokeMat_${Date.now()}_${i}`, scene);
        sm.diffuseColor = new BABYLON.Color3(0.12 + Math.random()*0.18, 0.12 + Math.random()*0.18, 0.12 + Math.random()*0.18);
        sm.alpha = 0.65 - Math.random()*0.25; sm.disableLighting = false; s.material = sm;
        s.position = pos.clone().add(new BABYLON.Vector3((Math.random()-0.5)*radius*0.4, 0.1 + Math.random()*0.6, (Math.random()-0.5)*radius*0.4));

      const SHAKE_DURATION = 0.35;

      let t = 0; const duration = 0.9;
      const obs = scene.onBeforeRenderObservable.add(() => {
        const dt = engine.getDeltaTime() / 1000; t += dt;
        const scale = BABYLON.Scalar.Lerp(0.02, Math.max(1.0, radius * 0.9), Math.min(1, t / 0.18));
        blast.scaling.setAll(scale);

        flash.intensity = Math.max(0, 3.5 * (1 - (t / (duration * 0.6))));

          s.rotation.x += dt * (0.2 + i * 0.05); s.rotation.y += dt * (0.15 + i * 0.03); s.scaling.addInPlace(new BABYLON.Vector3(0.1*dt, 0.15*dt, 0.1*dt));

        }

          camera.heightOffset = originalCamHeight + (Math.random() - 0.5) * mag;
          camera.radius = originalCamRadius + (Math.random() - 0.5) * (mag * 0.8);

          try { flash.dispose(); } catch(e) {}
          try { sparks.stop(); sparks.dispose(); } catch(e) {}
          try { smokePS.stop(); smokePS.dispose(); } catch(e) {}
          scene.onBeforeRenderObservable.remove(obs);
        }
      });

      // damage NPCs around blast (changed from instant dispose to damage)
      for (let i = npcs.length - 1; i >= 0; i--) {
        const n = npcs[i]; const d = BABYLON.Vector3.Distance(n.root.position, pos);

    }

    /* ---------------------------

    function placeBlockCenter() {

      if (pick && pick.hit && pick.pickedPoint) spawnBlockAt(pick.pickedPoint, 1.4);

       --------------------------- */
    function swordHitCheck() {
      const forward = playerForward();
      for (let i = npcs.length - 1; i >= 0; i--) {
        const n = npcs[i]; const to = n.root.position.subtract(player.position); const dist = to.length();

            const kb = n.root.position.subtract(player.position).normalize().scale(3);
            n.velocity = (n.velocity || new BABYLON.Vector3(0,0,0)).add(kb);

      if (input["s"] || input["keys"]) { player.translate(BABYLON.Axis.Z, -10 * dt, BABYLON.Space.LOCAL); moving = true; }
      if (input["a"] || input["keya"]) player.rotation.y -= 2.5 * dt; if (input["d"] || input["keyd"]) player.rotation.y += 2.5 * dt;

        const steerInput = (input["a"] || input["keya"]) ? -1 : (input["d"] || input["keyd"]) ? 1 : 0;

        car.root.position.addInPlace(forwardVec.scale(car.speed * dt * 0.1)); // scale factor for tuning

        car.speed *= Math.max(0, 1 - dt*0.2);

      // landing AABB
      const px2 = player.position.x, pz2 = player.position.z; const playerMinX2 = px2 - playerRadiusX, playerMaxX2 = px2 + playerRadiusX; const playerMinZ2 = pz2 - playerRadiusZ, playerMaxZ2 = pz2 + playerRadiusZ; const playerFeetY = player.position.y - GROUNDED_Y;
      let landed = false; if (velocityY <= 0) { for (let i=0;i<solidSurfaces.length;i++){ const s = solidSurfaces[i]; const bi = s.getBoundingInfo().boundingBox; const min = bi.minimumWorld, max = bi.maximumWorld; const topY = max.y; const surfMinX = min.x, surfMaxX = max.x, surfMinZ = min.z, surfMaxZ = max.z; const overlapX2 = (playerMaxX2 >= surfMinX) && (playerMinX2 <= surfMaxX); const overlapZ2 = (playerMaxZ2 >= surfMinZ) && (playerMinZ2 <= surfMaxZ); if (overlapX2 && overlapZ2) { if ((playerFeetY <= topY + 0.25 && prevFeetY >= topY - 1.0) || (playerFeetY < topY && prevFeetY >= topY - 1.0)) { player.position.y = topY + GROUNDED_Y; velocityY = 0; grounded = true; landed = true; break; } } } }
      if (!landed) { if (player.position.y <= GROUNDED_Y) { player.position.y = GROUNDED_Y; velocityY = 0; grounded = true; } else grounded = false; }
      prevFeetY = player.position.y - GROUNDED_Y;

      // WALK ANIM (player)
      if (moving && grounded && !swordSwing) { walkTime += dt * 8; leftLeg.rotation.x = Math.sin(walkTime) * 0.8; rightLeg.rotation.x = -Math.sin(walkTime) * 0.8; leftArm.rotation.x = -Math.sin(walkTime) * 0.6; rightArm.rotation.x = Math.sin(walkTime) * 0.6; }
      else { leftLeg.rotation.x *= 0.8; rightLeg.rotation.x *= 0.8; leftArm.rotation.x *= 0.8; rightArm.rotation.x *= 0.8; }
      if (!grounded) { leftLeg.rotation.x = 0; rightLeg.rotation.x = 0; leftArm.rotation.x = -2.8; rightArm.rotation.x = -2.8; }

      // SWORD ANIMATION (fixed interpolation)
      if (inventory[activeIndex] && inventory[activeIndex].id === "sword" && swordSwing) {
        swordTimer += dt; const tt = Math.min(1, swordTimer / SWORD_SWING_TIME);
        if (tt < 0.28 / SWORD_SWING_TIME) {
          const p = easeInOut(tt / (0.28 / SWORD_SWING_TIME));
          rightArm.rotation.x = lerp(defaultRightArmRot.x, 0, p);
          rightArm.rotation.y = lerp(defaultRightArmRot.y, 0, p);
        } else if (tt < 0.7 / SWORD_SWING_TIME) {
          const start = 0.28 / SWORD_SWING_TIME;
          const end = 0.7 / SWORD_SWING_TIME;
          const p = (tt - start) / (end - start);
          const ep = 1 - (1 - p) * (1 - p); // ease out
          rightArm.rotation.x = lerp(-3, 2, ep);
          rightArm.rotation.y = lerp(0, 0, ep);
          swordHitCheck();
        } else {
          // relax back
          rightArm.rotation.x = lerp(rightArm.rotation.x, defaultRightArmRot.x, 0.5);
          rightArm.rotation.y = lerp(rightArm.rotation.y, defaultRightArmRot.y, 0.5);
          sword.rotation.x = lerp(sword.rotation.x, defaultSwordRot.x, 0.5);
        }
        if (swordTimer >= SWORD_SWING_TIME) { swordSwing = false; swordTimer = 0; rightArm.rotation.copyFrom(defaultRightArmRot); sword.rotation.copyFrom(defaultSwordRot); }
      }

      // BOMBS update
      for (let i = bombs.length - 1; i >= 0; i--) {
        const b = bombs[i]; b.velocity.y += GRAVITY * dt; b.position.addInPlace(b.velocity.scale(dt)); b.life -= dt;
        if (b.position.y <= 0.4) { b.position.y = 0.4; b.velocity.y *= -0.4; b.velocity.x *= 0.6; b.velocity.z *= 0.6; }
        if (b.life <= 0) { explodeBombAt(b.position, 30); try{ b.dispose(); }catch(e){}; bombs.splice(i,1); }
      }

      // NPC AI (single stable loop) - now uses same model, same walk anim, same speed, faces destination
      for (let i = npcs.length - 1; i >= 0; i--) {
        const n = npcs[i];

        // update health bar position each frame
        updateNpcHealthBar(n);

        // safety init
        if (typeof n.velocityY !== 'number' || !isFinite(n.velocityY)) n.velocityY = 0;
        if (!n.groundOffset || !isFinite(n.groundOffset)) n.groundOffset = GROUNDED_Y;
        if (!n.velocity || !(n.velocity instanceof BABYLON.Vector3)) n.velocity = new BABYLON.Vector3(0,0,0);
        if (!n.limbs) n.limbs = {};

        // -------- RAGDOLL HANDLING: if ragdoll, skip AI and simulate flop --------
        if (n.ragdoll) {
          // gravity
          n.ragdollVel.y += GRAVITY * dt;
          // horizontal + vertical movement
          n.root.position.addInPlace(n.ragdollVel.scale(dt));
          n.root.position.y += n.velocityY * dt;
          // damp ragdoll velocity a bit
          n.ragdollVel.scaleInPlace(0.96);
          n.velocityY += GRAVITY * dt;
          // limb flop
          const limbs = n.limbs || {};
          if (limbs.la) limbs.la.rotation.x += n.ragdollAng.la * dt;
          if (limbs.ra) limbs.ra.rotation.x += n.ragdollAng.ra * dt;
          if (limbs.ll) limbs.ll.rotation.x += n.ragdollAng.ll * dt;
          if (limbs.rl) limbs.rl.rotation.x += n.ragdollAng.rl * dt;

          // raycast down and settle on ground
          const downFromR = n.root.position.add(new BABYLON.Vector3(0, 10, 0));
          const rayR = new BABYLON.Ray(downFromR, new BABYLON.Vector3(0, -1, 0), 30);
          const hitR = scene.pickWithRay(rayR, (m) => m === ground || solidSurfaces.indexOf(m) !== -1);
          if (hitR && hitR.hit && hitR.pickedPoint && isFinite(hitR.pickedPoint.y)) {
            const settleY = hitR.pickedPoint.y + n.groundOffset * 0.6;
            if (n.root.position.y <= settleY) {
              n.root.position.y = settleY;
              n.ragdollVel.y = 0;
              // slow limb motion
              n.ragdollAng.la *= 0.96; n.ragdollAng.ra *= 0.96; n.ragdollAng.ll *= 0.96; n.ragdollAng.rl *= 0.96;
              // slowly damp horizontal movement
              n.ragdollVel.scaleInPlace(0.7);
            }
          }

          // despawn ragdoll after 60 seconds
          if (n.ragdollDeathTime && (Date.now() - n.ragdollDeathTime) > 60000) {
            disposeNpc(n);
            continue;
          }

          // skip the rest of AI/walk logic for ragdolled NPCs
          continue;
        }

        // integrate vertical physics
        n.velocityY += GRAVITY * dt;
        n.velocityY = Math.max(-120, Math.min(120, n.velocityY));
        n.root.position.y += n.velocityY * dt;

        // raycast down and snap using SAME logic as player
        const downFrom = n.root.position.add(new BABYLON.Vector3(0,30,0));
        const downRay = new BABYLON.Ray(downFrom, new BABYLON.Vector3(0,-1,0), 200);
        const downRes = scene.pickWithRay(downRay, (m) => m === ground || solidSurfaces.indexOf(m) !== -1);
        if (downRes && downRes.hit && downRes.pickedPoint && isFinite(downRes.pickedPoint.y)) {
          const surfaceY = downRes.pickedPoint.y;
          if (n.root.position.y <= surfaceY + n.groundOffset + 0.05) { n.root.position.y = surfaceY + n.groundOffset; n.velocityY = 0; n.grounded = true; }
          else n.grounded = false;
        }

        // choose destination occasionally
        if (!n.dest || Math.random() < 0.006 || BABYLON.Vector3.Distance(new BABYLON.Vector3(n.root.position.x,0,n.root.position.z), new BABYLON.Vector3(n.dest.x,0,n.dest.z)) < 0.7) {
          const rx = n.root.position.x + (Math.random() - 0.5) * 14;
          const rz = n.root.position.z + (Math.random() - 0.5) * 14;
          const from = new BABYLON.Vector3(rx, 60, rz);
          const to = new BABYLON.Vector3(rx, -20, rz);
          const ray = new BABYLON.Ray(from, to.subtract(from).normalize(), 200);
          const rayRes = scene.pickWithRay(ray, (m) => m === ground || solidSurfaces.indexOf(m) !== -1);
          let ty = n.root.position.y - n.groundOffset;
          if (rayRes && rayRes.hit && rayRes.pickedPoint && isFinite(rayRes.pickedPoint.y)) ty = rayRes.pickedPoint.y;
          n.dest = new BABYLON.Vector3(rx, ty + n.groundOffset, rz);
        }

        // horizontal: compute dir to destination
        if (n.dest) {
          const horizontalHere = new BABYLON.Vector3(n.root.position.x, 0, n.root.position.z);
          const horizontalDest = new BABYLON.Vector3(n.dest.x, 0, n.dest.z);
          const dir = horizontalDest.subtract(horizontalHere);
          const dist = dir.length();
          if (dist > 0.05) {
            // rotate to face destination smoothly - same yaw convention as player (atan2(dx, dz))
            const dx = n.dest.x - n.root.position.x;
            const dz = n.dest.z - n.root.position.z;
            if (Math.abs(dx) > 0.0001 || Math.abs(dz) > 0.0001) {
              const targetYaw = Math.atan2(dx, dz);
              const curYaw = (typeof n.root.rotation.y === "number") ? n.root.rotation.y : 0;
              let delta = shortestAngleDelta(curYaw, targetYaw);
              const maxTurn = (n.turnSpeed || NPC_TURN_SPEED) * dt * (n.speed / 15.0); // scale with speed if desired
              if (Math.abs(delta) <= maxTurn || dist < 0.6) {
                n.root.rotation.y = targetYaw; // snap when very small or very close
              } else {
                if (delta > 0) delta = Math.min(delta, maxTurn);
                else delta = Math.max(delta, -maxTurn);
                n.root.rotation.y = curYaw + delta;
              }
            }

            // move toward destination at same forward speed as player
            dir.normalize();
            n.root.position.addInPlace(dir.scale(n.speed * dt));
          }
        }

        // re-align to ground after horizontal move (same as earlier)
        const downFrom2 = n.root.position.add(new BABYLON.Vector3(0, 30, 0));
        const downRay2 = new BABYLON.Ray(downFrom2, new BABYLON.Vector3(0, -1, 0), 200);
        const r2 = scene.pickWithRay(downRay2, (m) => m === ground || solidSurfaces.indexOf(m) !== -1);
        if (r2 && r2.hit && r2.pickedPoint && isFinite(r2.pickedPoint.y)) { n.root.position.y = r2.pickedPoint.y + n.groundOffset; n.velocityY = 0; n.grounded = true; }

        // clamp final vertical position
        if (!isFinite(n.root.position.y)) n.root.position.y = n.groundOffset;
        if (n.root.position.y > 500) n.root.position.y = 500;
        if (n.root.position.y < -50) n.root.position.y = n.groundOffset;

        // apply horizontal knockback velocity
        if (n.velocity && typeof n.velocity.lengthSquared === "function" && n.velocity.lengthSquared() > 0.001) {
          if (!isFinite(n.velocity.x) || !isFinite(n.velocity.y) || !isFinite(n.velocity.z)) n.velocity = new BABYLON.Vector3(0,0,0);
          else { n.root.position.addInPlace(n.velocity.scale(dt)); n.velocity = n.velocity.scale(Math.max(0, 1 - dt*2.8)); }
        }

        // WALK ANIMATION: use EXACT same formulas as player for arms/legs
        try {
          const { la, ra, ll, rl } = n.limbs;
          // detect horizontal movement by comparing dest vs position
          let movingHorizontally = false;
          if (n.dest) {
            const dx = n.dest.x - n.root.position.x;
            const dz = n.dest.z - n.root.position.z;
            movingHorizontally = Math.hypot(dx, dz) > 0.1;
          }

          if (n.grounded && movingHorizontally) {
            n.walkTime += dt * 8; // same walk frequency as player
            const wt = n.walkTime;
            if (ll) ll.rotation.x = Math.sin(wt) * 0.8;
            if (rl) rl.rotation.x = -Math.sin(wt) * 0.8;
            if (la) la.rotation.x = -Math.sin(wt) * 0.6;
            if (ra) ra.rotation.x = Math.sin(wt) * 0.6;
          } else {
            // relax limbs exactly like player code
            if (ll) ll.rotation.x *= 0.8;
            if (rl) rl.rotation.x *= 0.8;
            if (la) la.rotation.x *= 0.8;
            if (ra) ra.rotation.x *= 0.8;
          }
        } catch(e) {
          // ignore disposed meshes
        }
      }

      // Update car prompts and seat detection
      nearCar = null;
      for (let i=0;i<cars.length;i++){
        const car = cars[i];
        // compute seat world pos from body transform:
        const seatWorld = car.body.getAbsolutePosition().add(BABYLON.Vector3.TransformCoordinates(car.seatLocal, car.body.getWorldMatrix()));
        // project seat to screen
        const proj = BABYLON.Vector3.Project(seatWorld, BABYLON.Matrix.Identity(), scene.getTransformMatrix(), camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight()));
        if (car.prompt && isFinite(proj.x) && isFinite(proj.y)) {
          car.prompt.isVisible = true;
          car.prompt.left = proj.x - engine.getRenderWidth()/2 + "px";
          car.prompt.top = proj.y - engine.getRenderHeight()/2 + "px";
        } else if (car.prompt) {
          car.prompt.isVisible = false;
        }

        // check near
        const d = BABYLON.Vector3.Distance(player.position, car.root.position.add(car.body.position));
        if (d < CAR_ENTER_DISTANCE && !playerCar && !car.occupant) {
          nearCar = car;
          if (car.prompt) car.prompt.isVisible = true;
          // small visual emphasis
          if (car.prompt) car.prompt.background = "rgba(0,0,0,0.75)";
        } else {
          if (car.prompt && !car.occupant) car.prompt.isVisible = false;
        }
      }

      // If player is in car, update its prompt off and handle collisions (already in car section)
      if (playerCar) {
        checkCarNpcCollisions(playerCar, dt);
      }

    });

    /* ---------------------------
       UI helpers / cleanup / start loop
       --------------------------- */
    function rebuildHotbarCounts() { buildHotbar(); }
    window.addEventListener("beforeunload", () => { try { hudHotbar.remove(); } catch(e){}; npcs.forEach(n => { try { n.root.getChildren().forEach(c=>c.dispose()); n.root.dispose(); } catch(e){} }); bombs.forEach(b => { try{ b.dispose(); } catch(e){} }); cars.forEach(c => { try{ if (c.prompt) ui.removeControl(c.prompt); c.root.getChildren().forEach(cc=>cc.dispose()); c.root.dispose(); }catch(e){} });});
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());

  } catch (err) {
    console.error("Fatal script error:", err);
    const el = document.createElement("div");
    el.style.position = "absolute"; el.style.left = "12px"; el.style.top = "12px"; el.style.zIndex = 99999;
    el.style.padding = "8px 10px"; el.style.background = "rgba(0,0,0,0.6)"; el.style.color = "white"; el.style.borderRadius = "8px";
    el.style.fontFamily = "monospace"; el.style.fontSize = "12px";
    el.textContent = "Script error — open DevTools Console (F12).";
    document.body.appendChild(el);
  }
})();
</script>
