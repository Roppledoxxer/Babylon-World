<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BJW — Babylon City</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;font-family:'Segoe UI',Arial,sans-serif;user-select:none}
#renderCanvas{width:100%;height:100%;touch-action:none;display:block}

/* ═══════════════════════════════ MAIN MENU ═══════════════════════════════ */
#mainMenu{display:flex;position:fixed;top:0;left:0;width:100%;height:100%;z-index:10001;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#mainMenu.hidden{display:none}
.menu-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(160deg,#0d0d0d 0%,#1a0a2e 30%,#0d0d0d 60%,#1a0020 100%)}
.menu-particles{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
.menu-particle{position:absolute;width:2px;height:2px;background:#ff00ff;border-radius:50%;box-shadow:0 0 6px #ff00ff,0 0 12px #ff00ff;animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{transform:translateY(100vh);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh);opacity:0}}
.menu-container{text-align:center;padding:50px 60px;border-radius:20px;background:rgba(0,0,0,0.75);backdrop-filter:blur(20px);border:1px solid rgba(255,0,255,0.3);box-shadow:0 0 60px rgba(255,0,255,0.15),0 0 120px rgba(127,0,255,0.1);z-index:1;position:relative}
.game-title{font-size:clamp(36px,8vw,80px);font-weight:900;color:#fff;margin:0 0 8px 0;text-shadow:0 0 30px rgba(255,0,255,0.6),0 0 60px rgba(255,0,255,0.3);letter-spacing:6px;line-height:1}
.game-title span{color:#ff00ff}
.game-subtitle{font-size:clamp(14px,2.5vw,22px);color:rgba(255,255,255,0.5);margin:0 0 40px 0;letter-spacing:8px;text-transform:uppercase;font-weight:300}
.menu-version{position:absolute;bottom:15px;right:20px;color:rgba(255,255,255,0.2);font-size:11px;letter-spacing:2px}
.start-button{padding:18px 70px;font-size:clamp(16px,2.5vw,24px);font-weight:700;background:transparent;color:#ff00ff;border:2px solid #ff00ff;border-radius:50px;cursor:pointer;transition:all .4s cubic-bezier(.4,0,.2,1);text-transform:uppercase;letter-spacing:4px;position:relative;overflow:hidden}
.start-button::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,0,255,0.2),transparent);transition:left .5s}
.start-button:hover{background:rgba(255,0,255,0.15);box-shadow:0 0 30px rgba(255,0,255,0.4),0 0 60px rgba(255,0,255,0.2);transform:scale(1.05)}
.start-button:hover::before{left:100%}
.start-button:active{transform:scale(0.97)}
.menu-controls{margin-top:30px;display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
.menu-key{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);font-size:11px;letter-spacing:1px}
.menu-key kbd{background:rgba(255,255,255,0.1);padding:2px 8px;border-radius:4px;font-family:inherit;color:rgba(255,255,255,0.6)}

/* ═══════════════════════════════ HUD ═══════════════════════════════ */
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100}
#hud *{pointer-events:auto}

.hud-health-container{position:absolute;bottom:200px;left:20px;display:flex;flex-direction:column;gap:6px}
.hud-bar{width:200px;height:6px;background:rgba(0,0,0,0.6);border-radius:3px;overflow:hidden;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.08)}
.hud-bar-fill{height:100%;border-radius:3px;transition:width .3s ease}
.hud-bar-health .hud-bar-fill{background:linear-gradient(90deg,#ff3333,#ff6666);box-shadow:0 0 8px rgba(255,50,50,0.5)}
.hud-bar-armor .hud-bar-fill{background:linear-gradient(90deg,#4488ff,#66aaff);box-shadow:0 0 8px rgba(68,136,255,0.5)}
.hud-bar-label{font-size:10px;color:rgba(255,255,255,0.5);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}

.hud-money{position:absolute;top:20px;right:20px;font-size:28px;color:#7FFF00;font-weight:700;text-shadow:0 0 15px rgba(127,255,0,0.4);letter-spacing:1px}
.hud-money-symbol{font-weight:400;opacity:0.6;margin-right:2px}

.hud-wanted{position:absolute;top:60px;right:20px;display:flex;gap:4px;align-items:center}
.hud-star{font-size:18px;transition:all .3s;filter:grayscale(1) brightness(0.3)}
.hud-star.active{filter:none;color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,0.6);animation:starPulse 1s ease-in-out infinite}
@keyframes starPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.hud-wanted-timer{font-size:10px;color:rgba(255,255,255,0.3);margin-left:8px;letter-spacing:1px}

.hud-weapon{position:absolute;bottom:20px;right:20px;display:flex;align-items:flex-end;gap:12px;padding:12px 18px;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);border-radius:12px;border:1px solid rgba(255,255,255,0.08)}
.hud-weapon-name{font-size:14px;color:rgba(255,255,255,0.8);font-weight:600;letter-spacing:1px}
.hud-weapon-ammo{font-size:24px;color:rgba(255,255,255,0.9);font-weight:700}
.hud-weapon-ammo-label{font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:2px;text-transform:uppercase;margin-top:2px}

/* Hotbar */
#hudHotbar{position:absolute;bottom:80px;right:20px;display:flex;gap:4px;z-index:200}
.hotbar-slot{width:52px;height:52px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:20px;cursor:pointer;transition:all .2s;position:relative}
.hotbar-slot .slot-key{position:absolute;top:3px;left:6px;font-size:9px;color:rgba(255,255,255,0.25);font-weight:600}
.hotbar-slot.active{background:rgba(255,0,255,0.15);border-color:rgba(255,0,255,0.5);box-shadow:0 0 15px rgba(255,0,255,0.2)}
.hotbar-slot:hover{border-color:rgba(255,255,255,0.3)}

/* Crosshair */
#crosshair{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;pointer-events:none;z-index:150;display:none}
.ch-dot{position:absolute;width:3px;height:3px;background:rgba(255,100,100,0.9);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
.ch-line{position:absolute;background:rgba(255,100,100,0.6)}
.ch-h{width:8px;height:1px;top:50%;left:50%;margin-top:-0.5px}
.ch-h.l{transform:translateX(-8px)}.ch-h.r{transform:translateX(1px)}
.ch-v{width:1px;height:8px;left:50%;top:50%;margin-left:-0.5px}
.ch-v.t{transform:translateY(-8px)}.ch-v.b{transform:translateY(1px)}

/* Scope overlay */
.scope-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at center,transparent 15%,rgba(0,0,0,0.85) 100%);z-index:99;pointer-events:none}
.scope-overlay.active{display:block}

/* Minimap */
#minimap{position:absolute;bottom:20px;left:20px;width:150px;height:150px;border-radius:50%;background:rgba(0,0,0,0.7);border:2px solid rgba(255,255,255,0.1);box-shadow:0 0 20px rgba(0,0,0,0.5);overflow:hidden}

/* Kill feed */
#killFeed{position:absolute;top:20px;left:20px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.kill-entry{padding:6px 12px;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);border-radius:6px;font-size:12px;color:rgba(255,255,255,0.7);border-left:3px solid #ff3333;animation:killFadeIn .3s ease,killFadeOut .5s ease 3s forwards;white-space:nowrap}
@keyframes killFadeIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes killFadeOut{to{transform:translateX(-10px);opacity:0}}

/* Damage indicator */
.damage-flash{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:98;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,0,0,0.3) 100%);opacity:0;transition:opacity .1s}
.damage-flash.active{opacity:1}

/* Speed lines */
.speed-lines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:97;background:radial-gradient(ellipse at center,transparent 30%,rgba(255,255,255,0.03) 100%);opacity:0;transition:opacity .3s}
.speed-lines.active{opacity:1}

/* Hint bar */
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);color:rgba(255,255,255,0.4);z-index:200;font-size:11px;letter-spacing:1px;text-align:center;pointer-events:none}

/* ═══════════════════════════════ DEATH SCREEN ═══════════════════════════════ */
#deathOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999}
#deathPopup{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10000;text-align:center;padding:60px 80px}
#deathPopup .death-text{font-size:clamp(60px,12vw,120px);font-weight:900;color:#ff0000;text-shadow:0 0 40px rgba(255,0,0,0.6),0 0 80px rgba(255,0,0,0.3);letter-spacing:10px;animation:deathPulse 2s ease-in-out infinite}
@keyframes deathPulse{0%,100%{opacity:1}50%{opacity:0.7}}
#deathPopup .death-sub{font-size:16px;color:rgba(255,255,255,0.4);margin-top:10px;letter-spacing:4px}
.death-button{margin-top:40px;padding:16px 50px;font-size:20px;font-weight:700;background:transparent;color:#ff3333;border:2px solid #ff3333;border-radius:50px;cursor:pointer;transition:all .3s;text-transform:uppercase;letter-spacing:3px}
.death-button:hover{background:rgba(255,0,0,0.15);box-shadow:0 0 30px rgba(255,0,0,0.3);transform:scale(1.05)}

/* ═══════════════════════════════ ARMOR SHOP ═══════════════════════════════ */
#armorShopOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999}
#armorShopMenu{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10000;background:rgba(10,10,20,0.95);backdrop-filter:blur(20px);border:1px solid rgba(100,150,255,0.3);border-radius:20px;padding:40px 50px;text-align:center;min-width:350px}
.shop-title{font-size:28px;font-weight:700;color:#88bbff;margin-bottom:30px;letter-spacing:4px;text-transform:uppercase}
.armor-option{display:block;width:100%;margin:10px 0;padding:14px 24px;font-size:15px;font-weight:600;background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.8);border:1px solid rgba(100,150,255,0.2);border-radius:12px;cursor:pointer;transition:all .3s;text-transform:uppercase;letter-spacing:1px}
.armor-option:hover{background:rgba(100,150,255,0.1);border-color:rgba(100,150,255,0.4);transform:translateY(-2px)}
.armor-price{font-size:13px;color:#7FFF00;margin-top:4px;font-weight:400}
.armor-cancel{background:rgba(255,50,50,0.05)!important;border-color:rgba(255,50,50,0.2)!important;color:rgba(255,100,100,0.8)!important;margin-top:20px!important}
.armor-cancel:hover{background:rgba(255,50,50,0.15)!important;border-color:rgba(255,50,50,0.4)!important}

/* ═══════════════════════════════ HIT MARKER ═══════════════════════════════ */
.hit-marker{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:160;opacity:0}
.hit-marker.show{animation:hitMarkerAnim .3s ease forwards}
@keyframes hitMarkerAnim{0%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}}
.hm-line{position:absolute;background:white;box-shadow:0 0 4px white}
.hm-1{width:8px;height:2px;transform:translate(4px,-6px) rotate(45deg)}
.hm-2{width:8px;height:2px;transform:translate(-10px,-6px) rotate(-45deg)}
.hm-3{width:8px;height:2px;transform:translate(4px,6px) rotate(-45deg)}
.hm-4{width:8px;height:2px;transform:translate(-10px,6px) rotate(45deg)}
</style>
</head>
<body>

<!-- ═══ MAIN MENU ═══ -->
<div id="mainMenu">
  <div class="menu-bg"></div>
  <div class="menu-particles" id="menuParticles"></div>
  <div class="menu-container">
    <h1 class="game-title">BJW—<span>BABYLON</span> CITY</h1>
    <p class="game-subtitle">Enter the Chaos</p>
    <button class="start-button" id="startBtn">Start Game</button>
    <div class="menu-controls">
      <div class="menu-key"><kbd>WASD</kbd> Move</div>
      <div class="menu-key"><kbd>Space</kbd> Jump</div>
      <div class="menu-key"><kbd>Shift</kbd> Sprint</div>
      <div class="menu-key"><kbd>E</kbd> Interact</div>
      <div class="menu-key"><kbd>RMB</kbd> Aim</div>
      <div class="menu-key"><kbd>1-5</kbd> Weapons</div>
    </div>
    <div class="menu-version">v2.0</div>
  </div>
</div>

<canvas id="renderCanvas"></canvas>

<!-- ═══ HUD ═══ -->
<div id="hud">
  <div class="hud-health-container">
    <div>
      <div class="hud-bar-label">Health</div>
      <div class="hud-bar hud-bar-health"><div class="hud-bar-fill" id="healthBar" style="width:100%"></div></div>
    </div>
    <div>
      <div class="hud-bar-label">Armor</div>
      <div class="hud-bar hud-bar-armor"><div class="hud-bar-fill" id="armorBar" style="width:0%"></div></div>
    </div>
  </div>
  <div class="hud-money"><span class="hud-money-symbol">$</span><span id="moneyVal">0</span></div>
  <div class="hud-wanted">
    <span class="hud-star" id="star0">★</span>
    <span class="hud-star" id="star1">★</span>
    <span class="hud-star" id="star2">★</span>
    <span class="hud-star" id="star3">★</span>
    <span class="hud-star" id="star4">★</span>
    <span class="hud-wanted-timer" id="wantedTimer"></span>
  </div>
  <div class="hud-weapon">
    <div>
      <div class="hud-weapon-name" id="weaponName">Revolver</div>
      <div class="hud-weapon-ammo-label">Ammo</div>
    </div>
    <div class="hud-weapon-ammo" id="ammoVal">∞</div>
  </div>
  <div id="hudHotbar"></div>
  <div id="killFeed"></div>
</div>

<div id="crosshair">
  <div class="ch-dot"></div>
  <div class="ch-line ch-h l"></div>
  <div class="ch-line ch-h r"></div>
  <div class="ch-line ch-v t"></div>
  <div class="ch-line ch-v b"></div>
</div>
<div class="scope-overlay" id="scopeOverlay"></div>
<div class="damage-flash" id="damageFlash"></div>
<div class="speed-lines" id="speedLines"></div>
<div class="hit-marker" id="hitMarker">
  <div class="hm-line hm-1"></div>
  <div class="hm-line hm-2"></div>
  <div class="hm-line hm-3"></div>
  <div class="hm-line hm-4"></div>
</div>

<canvas id="minimap" width="150" height="150"></canvas>

<div id="deathOverlay"></div>
<div id="deathPopup">
  <div class="death-text">WASTED</div>
  <div class="death-sub">You have been eliminated</div>
  <button class="death-button" id="reloadBtn">Respawn</button>
</div>

<div id="armorShopOverlay"></div>
<div id="armorShopMenu">
  <div class="shop-title">Armor Shop</div>
  <button class="armor-option" id="armor1">Light Vest<div class="armor-price">+25 Armor — $100</div></button>
  <button class="armor-option" id="armor2">Tactical Vest<div class="armor-price">+50 Armor — $250</div></button>
  <button class="armor-option" id="armor3">Heavy Plating<div class="armor-price">+100 Armor — $500</div></button>
  <button class="armor-option armor-cancel" id="armorCancel">Close</button>
</div>

<div id="hint">WASD Move · Space Jump · Shift Sprint · E Interact · 1-5 Weapons · RMB Aim · LMB Fire</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   AUDIO PLACEHOLDERS — Replace the placeholder comments with real audio files.
   Each audio object uses new Audio("URL_HERE"). Replace "URL_HERE" with your file.
   ═══════════════════════════════════════════════════════════════════════════ */

const AudioManager = {
  // ── WEAPONS ──
  revolverShot:    null, // new Audio("URL_HERE") — Revolver gunshot, single loud bang
  smgShot:         null, // new Audio("URL_HERE") — SMG burst, rapid light shots
  shotgunShot:     null, // new Audio("URL_HERE") — Shotgun blast, heavy boom
  sniperShot:      null, // new Audio("URL_HERE") — Sniper crack, sharp echo
  bombThrow:       null, // new Audio("URL_HERE") — Throwing/whoosh sound
  explosion:       null, // new Audio("URL_HERE") — Explosion, big boom with debris
  emptyClip:       null, // new Audio("URL_HERE") — Click/empty magazine

  // ── IMPACTS ──
  bulletHit:       null, // new Audio("URL_HERE") — Bullet impact on flesh/NPC
  bulletRicochet:  null, // new Audio("URL_HERE") — Bullet ricochet off surface

  // ── PLAYER ──
  footstepWalk:    null, // new Audio("URL_HERE") — Footstep on asphalt, walking pace
  footstepRun:     null, // new Audio("URL_HERE") — Footstep on asphalt, running pace
  jump:            null, // new Audio("URL_HERE") — Jump grunt/whoosh
  land:            null, // new Audio("URL_HERE") — Landing thud
  playerHurt:      null, // new Audio("URL_HERE") — Player pain grunt
  playerDeath:     null, // new Audio("URL_HERE") — Player death sound
  healthPickup:    null, // new Audio("URL_HERE") — Health kit pickup, healing chime
  armorPickup:     null, // new Audio("URL_HERE") — Armor equip, metallic click

  // ── VEHICLES ──
  carEngine:       null, // new Audio("URL_HERE") — Car engine idle loop
  carAccel:        null, // new Audio("URL_HERE") — Car acceleration, revving
  carBrake:        null, // new Audio("URL_HERE") — Car braking/screech
  carEnter:        null, // new Audio("URL_HERE") — Car door open/close
  carExit:         null, // new Audio("URL_HERE") — Car door open, stepping out
  carCrash:        null, // new Audio("URL_HERE") — Car collision impact
  carHorn:         null, // new Audio("URL_HERE") — Car horn honk

  // ── NPCS ──
  npcDeath:        null, // new Audio("URL_HERE") — NPC death grunt
  policeShot:      null, // new Audio("URL_HERE") — Police gunfire
  policeSiren:     null, // new Audio("URL_HERE") — Police siren loop
  civilianScream:  null, // new Audio("URL_HERE") — Civilian panic scream

  // ── AMBIENT ──
  ambientCity:     null, // new Audio("URL_HERE") — City ambience loop (traffic, distant horns)
  ambientWind:     null, // new Audio("URL_HERE") — Wind ambience for height/speed
  ambientNight:    null, // new Audio("URL_HERE") — Night cricket/quiet ambience

  // ── MUSIC ──
  menuMusic:       null, // new Audio("URL_HERE") — Main menu background music loop
  gameMusic1:      null, // new Audio("URL_HERE") — In-game music track 1 (chill driving)
  gameMusic2:      null, // new Audio("URL_HERE") — In-game music track 2 (action/combat)
  gameMusic3:      null, // new Audio("URL_HERE") — In-game music track 3 (exploration)
  wantedMusic:     null, // new Audio("URL_HERE") — High wanted level intense music

  // ── UI ──
  menuClick:       null, // new Audio("URL_HERE") — Menu button click
  menuHover:       null, // new Audio("URL_HERE") — Menu button hover
  weaponSwitch:    null, // new Audio("URL_HERE") — Weapon switch/equip
  moneyPickup:     null, // new Audio("URL_HERE") — Money/reward sound, cash register

  /** Play a sound safely. name = key above. vol = 0-1. */
  play(name, vol) {
    const s = this[name];
    if (!s) return;
    const c = s.cloneNode ? s.cloneNode() : s;
    c.volume = Math.min(1, Math.max(0, vol || 0.5));
    c.play().catch(()=>{});
  },
  /** Loop a sound (returns the audio element for stopping). */
  loop(name, vol) {
    const s = this[name];
    if (!s) return null;
    s.loop = true;
    s.volume = Math.min(1, Math.max(0, vol || 0.3));
    s.play().catch(()=>{});
    return s;
  },
  stop(name) {
    const s = this[name];
    if (!s) return;
    s.pause();
    s.currentTime = 0;
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   MENU
   ═══════════════════════════════════════════════════════════════════════════ */
(function initMenuParticles(){
  const container = document.getElementById('menuParticles');
  for(let i=0;i<40;i++){
    const p = document.createElement('div');
    p.className = 'menu-particle';
    p.style.left = Math.random()*100 + '%';
    p.style.animationDuration = (4+Math.random()*8) + 's';
    p.style.animationDelay = Math.random()*6 + 's';
    p.style.width = p.style.height = (1+Math.random()*2) + 'px';
    container.appendChild(p);
  }
})();

document.getElementById('startBtn').onclick = function(){
  document.getElementById('mainMenu').classList.add('hidden');
  AudioManager.play('menuClick', 0.5);
  AudioManager.stop('menuMusic');
  AudioManager.loop('ambientCity', 0.15);
};
document.getElementById('reloadBtn').onclick = function(){ location.reload(); };
document.getElementById('armor1').onclick = function(){ buyArmor(25,100); };
document.getElementById('armor2').onclick = function(){ buyArmor(50,250); };
document.getElementById('armor3').onclick = function(){ buyArmor(100,500); };
document.getElementById('armorCancel').onclick = function(){ closeArmorShop(); };

function buyArmor(amount, cost){
  if(gameState.money >= cost){
    gameState.money -= cost;
    gameState.armor = Math.min(100, gameState.armor + amount);
    AudioManager.play('armorPickup', 0.6);
    closeArmorShop();
  }
}
function closeArmorShop(){
  document.getElementById('armorShopMenu').style.display='none';
  document.getElementById('armorShopOverlay').style.display='none';
}
function openArmorShop(){
  document.getElementById('armorShopMenu').style.display='block';
  document.getElementById('armorShopOverlay').style.display='block';
  AudioManager.play('menuClick', 0.4);
}

/* ═══════════════════════════════════════════════════════════════════════════
   GAME STATE
   ═══════════════════════════════════════════════════════════════════════════ */
const gameState = { money:0, health:100, armor:0, wantedLevel:0, wantedTimer:0, isSprinting:false, isDead:false, isAiming:false, kills:0, time:0 };
window.gameState = gameState;

function showDeathScreen(){
  gameState.isDead = true;
  document.getElementById('deathPopup').style.display='block';
  document.getElementById('deathOverlay').style.display='block';
  AudioManager.play('playerDeath', 0.7);
  AudioManager.stop('ambientCity');
}
function addKillFeed(text){
  const feed = document.getElementById('killFeed');
  const entry = document.createElement('div');
  entry.className = 'kill-entry';
  entry.textContent = text;
  feed.appendChild(entry);
  setTimeout(()=>{ try{entry.remove();}catch(e){} }, 3500);
  if(feed.children.length > 5) feed.firstChild.remove();
}
function showHitMarker(){
  const hm = document.getElementById('hitMarker');
  hm.classList.remove('show');
  void hm.offsetWidth;
  hm.classList.add('show');
}
function flashDamage(){
  const df = document.getElementById('damageFlash');
  df.classList.add('active');
  setTimeout(()=>df.classList.remove('active'), 150);
}

/* ═══════════════════════════════════════════════════════════════════════════
   ENGINE & SCENE
   ═══════════════════════════════════════════════════════════════════════════ */
(()=>{
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, {preserveDrawingBuffer:false, stencil:true, antialias:true});
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.45, 0.65, 0.85, 1.0);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.0008;
  scene.fogColor = new BABYLON.Color3(0.55, 0.7, 0.85);
  scene.ambientColor = new BABYLON.Color3(0.2, 0.2, 0.25);
  
  const ui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

  // ── CAMERA ──
  const camera = new BABYLON.FollowCamera("cam", new BABYLON.Vector3(0,12,-30), scene);
  camera.radius = 22;
  camera.heightOffset = 8;
  camera.rotationOffset = 180;
  camera.cameraAcceleration = 0.05;
  camera.maxCameraSpeed = 20;
  camera.attachControl(canvas, true);

  // ── LIGHTING ──
  const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.5,-1,-0.3), scene);
  sun.intensity = 0.9;
  sun.diffuse = new BABYLON.Color3(1.0, 0.95, 0.85);
  const sunPos = new BABYLON.Vector3(200, 400, 200);
  sun.position = sunPos;
  
  // Shadows
  const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
  shadowGen.useBlurExponentialShadowMap = true;
  shadowGen.blurKernel = 32;
  shadowGen.darkness = 0.3;

  const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
  hemi.intensity = 0.4;
  hemi.groundColor = new BABYLON.Color3(0.15, 0.12, 0.1);

  // ── SKY ──
  const sky = BABYLON.MeshBuilder.CreateSphere("sky", {diameter:3000}, scene);
  const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
  skyMat.backFaceCulling = false;
  skyMat.disableLighting = true;
  skyMat.emissiveColor = new BABYLON.Color3(0.53, 0.75, 0.92);
  sky.material = skyMat;

  // Clouds
  const cloudTex = new BABYLON.DynamicTexture("clouds", 512, scene);
  const ctxC = cloudTex.getContext();
  ctxC.clearRect(0,0,512,512);
  for(let i=0;i<50;i++){
    const x=Math.random()*512, y=Math.random()*512, r=30+Math.random()*40;
    const g = ctxC.createRadialGradient(x,y,r*0.2,x,y,r);
    g.addColorStop(0,'rgba(255,255,255,0.8)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctxC.fillStyle = g;
    ctxC.fillRect(x-r,y-r,r*2,r*2);
  }
  cloudTex.update();
  const cloudMat = new BABYLON.StandardMaterial("cloudMat", scene);
  cloudMat.opacityTexture = cloudTex;
  cloudMat.diffuseColor = BABYLON.Color3.White();
  cloudMat.backFaceCulling = false;
  cloudMat.disableLighting = true;
  const clouds = BABYLON.MeshBuilder.CreatePlane("clouds", {size:1500}, scene);
  clouds.rotation.x = Math.PI/2;
  clouds.position.y = 450;
  clouds.material = cloudMat;

  // ── GROUND ──
  const ground = BABYLON.MeshBuilder.CreateGround("ground", {width:2000, height:2000}, scene);
  const TILE=512;
  const tileTex = new BABYLON.DynamicTexture("asphaltTile", {width:TILE,height:TILE}, scene, false);
  const tc = tileTex.getContext();
  // Dark asphalt base
  tc.fillStyle="#2a2a2a"; tc.fillRect(0,0,TILE,TILE);
  // Subtle grid
  const gc=8, cw=TILE/gc, ch=TILE/gc;
  for(let gx=0;gx<gc;gx++) for(let gy=0;gy<gc;gy++){
    const v=32+Math.floor(Math.random()*12);
    tc.fillStyle='rgb('+v+','+v+','+(v+2)+')';
    tc.fillRect(gx*cw+3,gy*ch+3,cw-6,ch-6);
  }
  // Road markings
  tc.strokeStyle="rgba(255,255,200,0.25)"; tc.lineWidth=3;
  tc.setLineDash([20,20]);
  for(let i=0;i<gc;i+=2){
    tc.beginPath(); tc.moveTo(i*cw,0); tc.lineTo(i*cw,TILE); tc.stroke();
    tc.beginPath(); tc.moveTo(0,i*ch); tc.lineTo(TILE,i*ch); tc.stroke();
  }
  tc.setLineDash([]);
  tileTex.update();
  tileTex.wrapU = tileTex.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
  const asphaltMat = new BABYLON.StandardMaterial("asphalt", scene);
  asphaltMat.diffuseTexture = tileTex;
  asphaltMat.diffuseTexture.uScale = asphaltMat.diffuseTexture.vScale = 5;
  asphaltMat.specularColor = new BABYLON.Color3(0.05,0.05,0.05);
  ground.material = asphaltMat;
  ground.receiveShadows = true;

  // ── PARTICLE TEXTURE ──
  const particleTex = new BABYLON.DynamicTexture('pTex',64,scene,false);
  const pctx = particleTex.getContext();
  pctx.clearRect(0,0,64,64);
  const grad = pctx.createRadialGradient(32,32,2,32,32,30);
  grad.addColorStop(0,'rgba(255,255,255,1)');
  grad.addColorStop(0.6,'rgba(255,255,255,0.6)');
  grad.addColorStop(1,'rgba(255,255,255,0)');
  pctx.fillStyle=grad; pctx.fillRect(0,0,64,64);
  particleTex.update();

  // ── MATERIALS ──
  function makeMat(name, r, g, b){ const m=new BABYLON.StandardMaterial(name,scene); m.diffuseColor=new BABYLON.Color3(r,g,b); return m; }
  const bMats = [
    makeMat("bm1",0.72,0.72,0.76),
    makeMat("bm2",0.62,0.66,0.72),
    makeMat("bm3",0.82,0.78,0.72),
    makeMat("bm4",0.55,0.55,0.6),
    makeMat("bm5",0.75,0.7,0.65)
  ];
  const skyscraperMat = makeMat("skMat",0.22,0.22,0.28);
  const windowMat = new BABYLON.StandardMaterial("winMat",scene);
  windowMat.diffuseColor = new BABYLON.Color3(0.3,0.55,0.9);
  windowMat.emissiveColor = new BABYLON.Color3(0.05,0.1,0.2);
  windowMat.alpha = 0.55;
  const glassMat = new BABYLON.StandardMaterial("glassMat",scene);
  glassMat.diffuseColor = new BABYLON.Color3(0.6,0.75,0.9);
  glassMat.alpha = 0.4;
  const streetLampMat = makeMat("lampMat",0.3,0.3,0.3);
  const lightBulbMat = new BABYLON.StandardMaterial("bulbMat",scene);
  lightBulbMat.emissiveColor = new BABYLON.Color3(1.0,0.9,0.7);
  lightBulbMat.disableLighting = true;
  const sidewalkMat = makeMat("sidewalkMat",0.5,0.5,0.48);
  const parkMat = makeMat("parkMat",0.2,0.55,0.15);

  // ── BUILDINGS ──
  const buildings = [];
  const gridSize = 3;
  const blockSpacing = 200;

  for(let bx=-gridSize;bx<=gridSize;bx++) for(let bz=-gridSize;bz<=gridSize;bz++){
    const baseX=bx*blockSpacing, baseZ=bz*blockSpacing;
    if(Math.abs(bx)<=1 && Math.abs(bz)<=1) continue;
    const bW=55+Math.random()*45, bD=55+Math.random()*45, bH=70+Math.floor(Math.random()*10)*18;
    const b = BABYLON.MeshBuilder.CreateBox('b_'+bx+'_'+bz, {width:bW, depth:bD, height:bH}, scene);
    b.position.set(baseX, bH/2, baseZ);
    b.material = bMats[Math.floor(Math.random()*bMats.length)];
    b.receiveShadows = true;
    shadowGen.addShadowCaster(b);
    buildings.push(b);

    // Windows on front face
    const wRows=Math.floor(bH/10), wCols=Math.floor(bW/10);
    for(let wr=0;wr<wRows;wr++) for(let wc=0;wc<wCols;wc++){
      if(Math.random()>0.35) continue;
      const w=BABYLON.MeshBuilder.CreatePlane('w_'+bx+'_'+bz+'_'+wr+'_'+wc, {width:5,height:5},scene);
      w.position.set(baseX-bW/2+5+wc*10, bH*0.05+wr*10+5, baseZ-bD/2-0.1);
      w.material = windowMat;
    }
    // Rooftop detail
    if(Math.random()>0.5){
      const ac = BABYLON.MeshBuilder.CreateBox('ac_'+bx+'_'+bz, {width:4,depth:4,height:3}, scene);
      ac.position.set(baseX+(Math.random()-0.5)*bW*0.4, bH+1.5, baseZ+(Math.random()-0.5)*bD*0.4);
      ac.material = makeMat('acm',0.4,0.4,0.42);
    }
  }

  // Central skyscraper
  const skW=75, skD=75, skH=450;
  const skyscraper = BABYLON.MeshBuilder.CreateBox("skyscraper", {width:skW,depth:skD,height:skH}, scene);
  skyscraper.position.set(0, skH/2, 0);
  skyscraper.material = skyscraperMat;
  skyscraper.receiveShadows = true;
  shadowGen.addShadowCaster(skyscraper);
  buildings.push(skyscraper);

  // Skyscraper windows
  const swR=Math.floor(skH/12), swC=Math.floor(skW/8);
  for(let wr=0;wr<swR;wr++) for(let wc=0;wc<swC;wc++){
    if(Math.random()>0.5) continue;
    const w=BABYLON.MeshBuilder.CreatePlane('sw_'+wr+'_'+wc,{width:5,height:6},scene);
    w.position.set(-skW/2+4+wc*8, skH*0.02+wr*12+6, -skD/2-0.1);
    w.material=windowMat;
  }

  // Antenna on skyscraper
  const antenna = BABYLON.MeshBuilder.CreateCylinder("antenna",{diameter:1.5,height:40},scene);
  antenna.position.set(0,skH+20,0);
  antenna.material = makeMat("antMat",0.3,0.3,0.35);
  const antennaLight = new BABYLON.PointLight("antLight",new BABYLON.Vector3(0,skH+42,0),scene);
  antennaLight.intensity=0.3; antennaLight.range=60; antennaLight.diffuse=new BABYLON.Color3(1,0.2,0.2);

  // ── STREET LAMPS ──
  for(let i=-4;i<=4;i++){
    for(let side=-1;side<=1;side+=2){
      const lx=i*120+side*35, lz=side*35;
      const pole = BABYLON.MeshBuilder.CreateCylinder("pole_"+i+"_"+side,{diameter:0.6,height:12},scene);
      pole.position.set(lx,6,lz); pole.material=streetLampMat;
      const arm = BABYLON.MeshBuilder.CreateBox("arm_"+i+"_"+side,{width:3,height:0.4,depth:0.4},scene);
      arm.position.set(lx+1.5,12.2,lz); arm.material=streetLampMat;
      const bulb = BABYLON.MeshBuilder.CreateSphere("bulb_"+i+"_"+side,{diameter:1.2},scene);
      bulb.position.set(lx+3,11.8,lz); bulb.material=lightBulbMat;
      const pl = new BABYLON.PointLight("pl_"+i+"_"+side,new BABYLON.Vector3(lx+3,11,lz),scene);
      pl.intensity=0.25; pl.range=30; pl.diffuse=new BABYLON.Color3(1,0.9,0.7);
    }
  }

  // ── SIDEWALKS ──
  for(let i=-3;i<=3;i++){
    const sw = BABYLON.MeshBuilder.CreateBox("sw_"+i,{width:12,depth:600,height:0.4},scene);
    sw.position.set(i*200-94,0.2,0); sw.material=sidewalkMat; sw.receiveShadows=true;
    const sw2=sw.clone("sw2_"+i); sw2.position.set(i*200+94,0.2,0);
  }

  // ── PARK AREA ──
  const parkGround = BABYLON.MeshBuilder.CreateGround("park",{width:80,height:80},scene);
  parkGround.position.set(-100,0.05,-100); parkGround.material=parkMat; parkGround.receiveShadows=true;
  // Trees
  for(let i=0;i<8;i++){
    const tx=-100+(Math.random()-0.5)*70, tz=-100+(Math.random()-0.5)*70;
    const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk_"+i,{diameter:1.2,height:6},scene);
    trunk.position.set(tx,3,tz); trunk.material=makeMat("bark"+i,0.4,0.25,0.12);
    shadowGen.addShadowCaster(trunk);
    const foliage = BABYLON.MeshBuilder.CreateSphere("foliage_"+i,{diameter:8},scene);
    foliage.position.set(tx,8,tz); foliage.material=makeMat("leaf"+i,0.15+Math.random()*0.15,0.45+Math.random()*0.2,0.1);
    shadowGen.addShadowCaster(foliage);
  }

  const solidSurfaces = [ground];
  buildings.forEach(b=>solidSurfaces.push(b));

  // ── PLAYER ──
  const player = new BABYLON.TransformNode("player",scene);
  const GROUNDED_Y = 3;
  player.position.y = GROUNDED_Y;
  player.position.z = -50;

  const bodyMat = new BABYLON.StandardMaterial("body",scene);
  bodyMat.diffuseColor = new BABYLON.Color3(0.85,0.85,0.85);
  const torso = BABYLON.MeshBuilder.CreateBox("torso",{width:2,height:2.2,depth:1},scene);
  torso.parent=player; torso.position.set(0,0,0); torso.material=bodyMat;
  shadowGen.addShadowCaster(torso);
  const headMat = makeMat("headMat",0.9,0.8,0.7);
  const head = BABYLON.MeshBuilder.CreateBox("head",{width:1.3,height:1.3,depth:1.3},scene);
  head.parent=torso; head.position.set(0,1.8,0); head.material=headMat;
  const leftArm = BABYLON.MeshBuilder.CreateBox("lA",{height:2,width:0.7,depth:0.7},scene);
  leftArm.setPivotPoint(new BABYLON.Vector3(0,1,0)); leftArm.parent=torso; leftArm.position.set(-1.35,0,0); leftArm.material=bodyMat;
  const rightArm = BABYLON.MeshBuilder.CreateBox("rA",{height:2,width:0.7,depth:0.7},scene);
  rightArm.setPivotPoint(new BABYLON.Vector3(0,1,0)); rightArm.parent=torso; rightArm.position.set(1.35,0,0); rightArm.material=bodyMat;
  const pantsMat = makeMat("pantsMat",0.15,0.15,0.2);
  const leftLeg = BABYLON.MeshBuilder.CreateBox("lL",{height:2,width:0.8,depth:0.8},scene);
  leftLeg.setPivotPoint(new BABYLON.Vector3(0,1,0)); leftLeg.parent=torso; leftLeg.position.set(-0.45,-1.9,0); leftLeg.material=pantsMat;
  const rightLeg = BABYLON.MeshBuilder.CreateBox("rL",{height:2,width:0.8,depth:0.8},scene);
  rightLeg.setPivotPoint(new BABYLON.Vector3(0,1,0)); rightLeg.parent=torso; rightLeg.position.set(0.45,-1.9,0); rightLeg.material=pantsMat;
  camera.lockedTarget = torso;

  // ── POINTER LOCK ──
  canvas.addEventListener("click", ()=>{
    if(!document.pointerLockElement) canvas.requestPointerLock();
  });

  let cVelX=0, cVelY=0;
  const MOUSE_SENS = 0.003;
  scene.onPointerObservable.add(pi=>{
    if(pi.type===BABYLON.PointerEventTypes.POINTERMOVE && document.pointerLockElement===canvas){
      cVelX = (pi.event.movementX||0)*MOUSE_SENS;
      cVelY = -(pi.event.movementY||0)*0.05;
    }
  });

  // ── INPUT ──
  const input={};
  let nearCar=null, nearArmorShop=null;

  scene.onKeyboardObservable.add(kb=>{
    const key=(kb.event.code||kb.event.key)||'';
    const kl=(kb.event.key||key).toLowerCase();
    if(kb.type===BABYLON.KeyboardEventTypes.KEYDOWN){
      if(key==="Space"||kl===" ") input[" "]=true;
      if(key==="ShiftLeft"||key==="ShiftRight"||kl==="shift") gameState.isSprinting=true;
      input[kl]=true;
      if(key==="Digit1") setActiveIndex(0);
      if(key==="Digit2") setActiveIndex(1);
      if(key==="Digit3") setActiveIndex(2);
      if(key==="Digit4") setActiveIndex(3);
      if(key==="Digit5") setActiveIndex(4);
      if(kl==="f"||kl==="g") attemptUse();
      if(kl==="e"){
        if(playerCar) exitCar();
        else if(nearCar) enterCar(nearCar);
        else if(nearArmorShop) openArmorShop();
      }
    } else {
      if(key==="Space"||kl===" ") input[" "]=false;
      if(key==="ShiftLeft"||key==="ShiftRight"||kl==="shift") gameState.isSprinting=false;
      input[kl]=false;
    }
  });

  // Right click aim
  document.addEventListener("mousedown",e=>{
    if(e.button===2){
      const it=inventory[activeIndex];
      if(it&&it.id!=="bomb"){
        gameState.isAiming=true;
        document.getElementById("scopeOverlay").classList.add("active");
        camera.radius=10; camera.heightOffset=3;
      }
    }
  });
  document.addEventListener("mouseup",e=>{
    if(e.button===2){
      gameState.isAiming=false;
      document.getElementById("scopeOverlay").classList.remove("active");
      camera.radius=22; camera.heightOffset=8;
    }
  });
  document.addEventListener("contextmenu",e=>e.preventDefault());
  canvas.addEventListener("wheel",e=>{
    e.preventDefault();
    if(e.deltaY>0) setActiveIndex((activeIndex+1)%inventory.length);
    else setActiveIndex((activeIndex-1+inventory.length)%inventory.length);
    AudioManager.play('weaponSwitch', 0.4);
  },{passive:false});

  // ── INVENTORY ──
  const inventory = [
    {id:"revolver", label:"🔫", name:"Revolver", fireRate:0.18, damage:40, spread:0.04, pellets:1, audioKey:"revolverShot"},
    {id:"smg",      label:"⚡", name:"SMG",      fireRate:0.07, damage:18, spread:0.12, pellets:1, audioKey:"smgShot"},
    {id:"shotgun",  label:"💥", name:"Shotgun",  fireRate:0.4,  damage:55, spread:0.35, pellets:8, audioKey:"shotgunShot"},
    {id:"sniper",   label:"🎯", name:"Sniper",   fireRate:0.9,  damage:120,spread:0.008,pellets:1, audioKey:"sniperShot"},
    {id:"bomb",     label:"💣", name:"Bomb",     ammo:10, maxAmmo:10, audioKey:"bombThrow"}
  ];
  let activeIndex=0;

  const hudHotbar=document.getElementById("hudHotbar");
  function buildHotbar(){
    hudHotbar.innerHTML="";
    inventory.forEach((it,i)=>{
      const s=document.createElement("div");
      s.className="hotbar-slot"+(i===activeIndex?" active":"");
      s.innerHTML='<span class="slot-key">'+(i+1)+'</span><div style="pointer-events:none">'+it.label+'</div>';
      s.onclick=()=>setActiveIndex(i);
      hudHotbar.appendChild(s);
    });
  }
  buildHotbar();
  function setActiveIndex(i){ activeIndex=i; buildHotbar(); updateHeld(); updateAmmo(); }
  function updateAmmo(){
    const it=inventory[activeIndex];
    document.getElementById("ammoVal").textContent = it.id==="bomb" ? it.ammo : "∞";
    document.getElementById("weaponName").textContent = it.name;
  }
  updateAmmo();

  // ── GUN MODEL ──
  const gunMat = makeMat("gunMat",0.1,0.1,0.1);
  function createGun(){
    const g=new BABYLON.TransformNode("gunGrp",scene); g.parent=rightArm; g.position.set(0,-1.1,0.7);
    const body=BABYLON.MeshBuilder.CreateBox("gBody",{width:0.35,height:0.5,depth:1.3},scene); body.parent=g; body.material=gunMat;
    const barrel=BABYLON.MeshBuilder.CreateCylinder("gBarrel",{diameter:0.25,height:2.2},scene); barrel.parent=g; barrel.position.set(0,-1.3,0.4); barrel.rotation.x=Math.PI; barrel.material=gunMat;
    // Scope for sniper
    const scope=BABYLON.MeshBuilder.CreateCylinder("gScope",{diameter:0.2,height:0.8},scene); scope.parent=g; scope.position.set(0,0.35,0); scope.rotation.x=Math.PI/2; scope.material=gunMat; scope.setEnabled(false);
    g.setEnabled(false);
    return {gunGroup:g, gunBody:body, gunBarrel:barrel, scope};
  }
  const gun=createGun();
  const defaultRArmRot=rightArm.rotation.clone();
  const crosshairEl=document.getElementById("crosshair");
  
  function updateHeld(){
    const it=inventory[activeIndex];
    const isGun = it && it.id!=="bomb";
    gun.gunGroup.setEnabled(isGun);
    crosshairEl.style.display = isGun ? "block" : "none";
    gun.scope.setEnabled(it && it.id==="sniper");
  }
  updateHeld();

  let gunCooldown=0;
  const bombs=[];
  const bombMat=makeMat("bombMat",0.06,0.06,0.06);

  // ── HELPERS ──
  function lerp(a,b,t){return a+(b-a)*t}
  function wrapAngle(a){a=(a+Math.PI)%(Math.PI*2);if(a<0)a+=Math.PI*2;return a-Math.PI}
  function shortAngle(f,t){return wrapAngle(t-f)}
  const NPC_TURN=6;

  // ── HEALTH KITS ──
  const healthKitSpawns=[];
  const healthKitMat=new BABYLON.StandardMaterial("hkMat",scene);
  healthKitMat.diffuseColor=new BABYLON.Color3(1,1,1);

  function updateNpcHealthBar(n){
    if(!n||!n.healthBar||!n.torso)return;
    const hp=n.torso.getAbsolutePosition().add(new BABYLON.Vector3(0,2,0));
    const p=BABYLON.Vector3.Project(hp,BABYLON.Matrix.Identity(),scene.getTransformMatrix(),camera.viewport.toGlobal(engine.getRenderWidth(),engine.getRenderHeight()));
    if(!isFinite(p.x)||!isFinite(p.y)){n.healthBar.bg.isVisible=false;return}
    n.healthBar.bg.isVisible=true;
    n.healthBar.bg.left=p.x-engine.getRenderWidth()/2+"px";
    n.healthBar.bg.top=p.y-engine.getRenderHeight()/2-25+"px";
    const pct=Math.max(0,Math.min(1,n.health/n.maxHealth));
    n.healthBar.fill.width=Math.max(0,Math.floor(n.healthBar.width*pct))+"px";
    n.healthBar.fill.background = pct>0.6?"#44ff44":pct>0.25?"#ffcc00":"#ff3333";
  }

  function throwBomb(){
    const it=inventory[activeIndex];

    const b=BABYLON.MeshBuilder.CreateSphere('bomb_'+Date.now(),{diameter:1.5},scene);

  function fireGun(){
    const it=inventory[activeIndex];
    if(!it||it.id==="bomb")return;
    if(gunCooldown>0)return;
    gunCooldown=it.fireRate;
    const spread=gameState.isAiming?it.spread*0.25:it.spread;
    const fw=playerForward();
    const barrelPos=gun.gunBarrel.getAbsolutePosition();

    // Muzzle flash
    const flash=BABYLON.MeshBuilder.CreateSphere("mf_"+Date.now(),{diameter:0.7},scene);
    const fm=new BABYLON.StandardMaterial("fm_"+Date.now(),scene);
    fm.emissiveColor=new BABYLON.Color3(1,0.85,0.3); fm.alpha=0.9; fm.disableLighting=true;
    flash.material=fm; flash.position=barrelPos.add(fw.scale(1.2));
    let ft=0;
    const fo=scene.onBeforeRenderObservable.add(()=>{
      ft+=engine.getDeltaTime()/1000;
      fm.alpha=Math.max(0,0.9*(1-ft/0.08));
      if(ft>0.08){try{flash.dispose()}catch(e){};scene.onBeforeRenderObservable.remove(fo)}
    });

    // Tracer line
    const tracerEnd=barrelPos.add(fw.scale(150));
    const tracer=BABYLON.MeshBuilder.CreateLines("tracer_"+Date.now(),{points:[barrelPos,tracerEnd]},scene);
    tracer.color=new BABYLON.Color3(1,0.9,0.4); tracer.alpha=0.4;
    let tt=0;
    const to=scene.onBeforeRenderObservable.add(()=>{
      tt+=engine.getDeltaTime()/1000;
      tracer.alpha=Math.max(0,0.4*(1-tt/0.1));
      if(tt>0.1){try{tracer.dispose()}catch(e){};scene.onBeforeRenderObservable.remove(to)}
    });

    AudioManager.play(it.audioKey, 0.6);

    let hitSomething=false;
    for(let p=0;p<it.pellets;p++){
      const sx=(Math.random()-0.5)*spread, sy=(Math.random()-0.5)*spread;
      const screenX=engine.getRenderWidth()/2+sx*100;
      const screenY=engine.getRenderHeight()*0.3+sy*100;
      const hit=scene.pick(screenX,screenY,m=>{for(const n of npcs){if(n.root.getChildMeshes().includes(m))return true}return false});
      if(hit&&hit.hit&&hit.pickedMesh){
        for(const n of npcs){
          if(n.root.getChildMeshes().includes(hit.pickedMesh)){
            damageNpc(n,it.damage);
            if(!n.isPolice) increaseWantedLevel(0.5);
            hitSomething=true;
            AudioManager.play('bulletHit', 0.4);
            break;
          }
        }
      }
    }
    if(hitSomething) showHitMarker();
  }

  function explodeBombAt(pos, radius=30){
    AudioManager.play('explosion', 0.8);
    const blast=BABYLON.MeshBuilder.CreateSphere('bl_'+Date.now(),{diameter:80},scene);
    blast.position=pos.clone();
    const bm=new BABYLON.StandardMaterial('blm_'+Date.now(),scene);
    bm.emissiveColor=new BABYLON.Color3(1,0.6,0.1);bm.alpha=0.9;bm.disableLighting=true;
    blast.material=bm;
    const fl=new BABYLON.PointLight('el_'+Date.now(),pos.clone(),scene);
    fl.intensity=4;fl.range=radius*4;fl.diffuse=new BABYLON.Color3(1,0.7,0.3);

    const sparks=new BABYLON.ParticleSystem('sp_'+Date.now(),500,scene);
    sparks.particleTexture=particleTex;sparks.emitter=pos.clone();
    sparks.color1=new BABYLON.Color4(1,0.6,0.15,1);sparks.color2=new BABYLON.Color4(1,0.25,0.05,1);
    sparks.colorDead=new BABYLON.Color4(0.1,0.1,0.1,0);
    sparks.minSize=8;sparks.maxSize=16;sparks.minLifeTime=0.2;sparks.maxLifeTime=0.8;sparks.emitRate=500;
    sparks.blendMode=BABYLON.ParticleSystem.BLENDMODE_ONEONE;
    sparks.direction1=new BABYLON.Vector3(-1,-0.2,-1);sparks.direction2=new BABYLON.Vector3(1,1,1);
    sparks.gravity=new BABYLON.Vector3(0,-4,0);

    const smokePS=new BABYLON.ParticleSystem('sm_'+Date.now(),250,scene);
    smokePS.particleTexture=particleTex;smokePS.emitter=pos.clone();
    smokePS.color1=new BABYLON.Color4(0.15,0.15,0.15,0.6);smokePS.color2=new BABYLON.Color4(0.05,0.05,0.05,0.4);
    smokePS.colorDead=new BABYLON.Color4(0,0,0,0);
    smokePS.minSize=4;smokePS.maxSize=8;smokePS.minLifeTime=0.8;smokePS.maxLifeTime=2;smokePS.emitRate=150;
    smokePS.direction1=new BABYLON.Vector3(-0.8,0.8,-0.8);smokePS.direction2=new BABYLON.Vector3(0.8,1.5,0.8);smokePS.gravity=new BABYLON.Vector3(0,-1,0);

    const flames=[];
    for(let i=0;i<Math.max(6,radius*6);i++){
      const sz=1.5+Math.random()*2.5;
      const f=BABYLON.MeshBuilder.CreateBox('fl_'+Date.now()+'_'+i,{size:sz},scene);
      const fmat=new BABYLON.StandardMaterial('flm_'+Date.now()+'_'+i,scene);
      fmat.emissiveColor=new BABYLON.Color3(0.9+Math.random()*0.1,0.3+Math.random()*0.4,0.05);fmat.alpha=1;fmat.disableLighting=true;
      f.material=fmat;
      f.position=pos.clone().add(new BABYLON.Vector3((Math.random()-0.5)*radius*0.3,Math.random()*0.3,(Math.random()-0.5)*radius*0.3));
      f._vel=new BABYLON.Vector3((Math.random()-0.5)*35,8+Math.random()*20,(Math.random()-0.5)*35);
      f._life=0.4+Math.random()*0.5;f._mat=fmat;flames.push(f);
    }

    const origH=camera.heightOffset, origR=camera.radius;
    sparks.start();smokePS.start();
    let t=0;const dur=0.8;
    const obs=scene.onBeforeRenderObservable.add(()=>{
      const dt=engine.getDeltaTime()/1000;t+=dt;
      blast.scaling.setAll(lerp(0.01,Math.max(1,radius*0.8),Math.min(1,t/0.15)));
      bm.alpha=Math.max(0,0.9*(1-t/dur));
      fl.intensity=Math.max(0,4*(1-t/(dur*0.5)));
      for(let i=flames.length-1;i>=0;i--){
        const f=flames[i]; f._vel.y-=15*dt; f.position.addInPlace(f._vel.scale(dt));
        if(f._mat)f._mat.alpha=Math.max(0,f._life/0.8);
        f._life-=dt;if(f._life<=0){try{f.dispose()}catch(e){};flames.splice(i,1)}
      }
      if(t<0.3){const mag=0.25*(0.3-t)/0.3;camera.heightOffset=origH+(Math.random()-0.5)*mag;camera.radius=origR+(Math.random()-0.5)*mag*0.6}
      else{camera.heightOffset=origH;camera.radius=origR}
      if(t>dur&&flames.length===0){
        try{blast.dispose()}catch(e){};try{fl.dispose()}catch(e){};
        try{sparks.stop();sparks.dispose()}catch(e){};try{smokePS.stop();smokePS.dispose()}catch(e){};
        scene.onBeforeRenderObservable.remove(obs);
      }
    });

    // Damage NPCs
    for(let i=npcs.length-1;i>=0;i--){
      const n=npcs[i];const d=BABYLON.Vector3.Distance(n.root.position,pos);
      if(d<=radius*1.8){
        const pct=1-Math.min(1,d/(radius*1.8));
        damageNpc(n,Math.round(30+pct*120));
        const dir=n.root.position.subtract(pos).normalize();
        n.velocity=n.velocity.add(dir.scale(6*pct)); n.velocityY+=4*pct;
        if(!n.isPolice) increaseWantedLevel(1);
      }
    }
    // Damage player
    const pd=BABYLON.Vector3.Distance(player.position,pos);
    if(pd<radius*1.5){
      const pct=1-Math.min(1,pd/(radius*1.5));
      damagePlayer(Math.round(20+pct*80));
    }
  }

    if(!playerCar)return;
    const car=playerCar;
    player.getChildMeshes().forEach(m=>m.setEnabled(true));
    player.position.copyFrom(car.root.position.add(new BABYLON.Vector3(0,car.body.position.y+1,-1)));
    camera.lockedTarget=torso;camera.radius=22;camera.heightOffset=8;
    car.occupant=null;playerCar=null;
    AudioManager.play('carExit', 0.5);
    updateHeld();
  }
  function checkCarNpcCollisions(car){
    if(!car)return;
    const cp=car.root.position.add(car.body.position);
    for(let i=npcs.length-1;i>=0;i--){
      const n=npcs[i];
      if(BABYLON.Vector3.Distance(cp,n.root.position)<car.radius+1){
        damageNpc(n,Math.round(Math.abs(car.speed)*0.8)+30);
        const dir=n.root.position.subtract(cp).normalize();
        n.velocity=n.velocity.add(dir.scale(10));n.velocityY=5;
        car.speed*=0.6;
        AudioManager.play('carCrash', 0.5);
      }
    }
  }

  // ── MINIMAP ──
  const mmCanvas=document.getElementById("minimap");
  const mmCtx=mmCanvas.getContext("2d");
  function renderMinimap(){
    const w=mmCanvas.width, h=mmCanvas.height, r=w/2;
    mmCtx.clearRect(0,0,w,h);
    // Circle clip
    mmCtx.save();
    mmCtx.beginPath();mmCtx.arc(r,r,r,0,Math.PI*2);mmCtx.clip();
    mmCtx.fillStyle="#111";mmCtx.fillRect(0,0,w,h);
    // Grid
    mmCtx.strokeStyle="rgba(255,255,255,0.05)";mmCtx.lineWidth=0.5;
    for(let i=0;i<6;i++){const p=(i/5)*w;mmCtx.beginPath();mmCtx.moveTo(p,0);mmCtx.lineTo(p,h);mmCtx.stroke();mmCtx.beginPath();mmCtx.moveTo(0,p);mmCtx.lineTo(w,p);mmCtx.stroke()}
    const mapSz=500, sf=w/mapSz;
    // Player
    mmCtx.fillStyle="#fff";
    const px=(player.position.x+mapSz/2)*sf, py=(player.position.z+mapSz/2)*sf;
    mmCtx.beginPath();mmCtx.arc(px,py,3,0,Math.PI*2);mmCtx.fill();
    // Direction
    const fw=playerForward();
    mmCtx.strokeStyle="rgba(255,255,255,0.5)";mmCtx.lineWidth=1.5;
    mmCtx.beginPath();mmCtx.moveTo(px,py);mmCtx.lineTo(px+fw.x*12,py+fw.z*12);mmCtx.stroke();
    // NPCs
    for(const n of npcs){
      if(n.ragdoll)continue;
      mmCtx.fillStyle=n.isPolice?"#4488ff":"#ff4444";
      const nx=(n.root.position.x+mapSz/2)*sf, nz=(n.root.position.z+mapSz/2)*sf;
      if(nx>=0&&nx<=w&&nz>=0&&nz<=h){mmCtx.beginPath();mmCtx.arc(nx,nz,1.5,0,Math.PI*2);mmCtx.fill()}
    }
    // Cars
    mmCtx.fillStyle="#ffcc00";
    for(const c of cars){
      const cx=(c.root.position.x+mapSz/2)*sf, cz=(c.root.position.z+mapSz/2)*sf;
      if(cx>=0&&cx<=w&&cz>=0&&cz<=h){mmCtx.beginPath();mmCtx.arc(cx,cz,2.5,0,Math.PI*2);mmCtx.fill()}
    }
    mmCtx.restore();
  }

  // ── MAIN LOOP ──
  let velocityY=0, grounded=false, prevFeetY=player.position.y-GROUNDED_Y, walkTime=0;
  let footstepTimer=0;

  scene.onBeforeRenderObservable.add(()=>{
    const dt=engine.getDeltaTime()/1000;
    if(gameState.isDead)return;
    gameState.time+=dt;
    clouds.position.z+=dt*3;if(clouds.position.z>1500)clouds.position.z=-1500;
    if(gunCooldown>0) gunCooldown-=dt;

    // ── HUD UPDATE ──
    document.getElementById("healthBar").style.width=Math.max(0,gameState.health)+"%";
    document.getElementById("armorBar").style.width=Math.max(0,gameState.armor)+"%";
    document.getElementById("moneyVal").textContent=gameState.money.toLocaleString();
    for(let i=0;i<5;i++) document.getElementById("star"+i).className="hud-star"+(i<gameState.wantedLevel?" active":"");
    if(gameState.wantedTimer>0){gameState.wantedTimer-=dt;document.getElementById("wantedTimer").textContent=Math.ceil(gameState.wantedTimer)+"s"}
    else{if(gameState.wantedLevel>0)gameState.wantedLevel--;document.getElementById("wantedTimer").textContent=""}

    // ── CAMERA ──
    if(Math.abs(cVelX)>0.0001||Math.abs(cVelY)>0.0001){
      player.rotation.y+=cVelX;
      camera.heightOffset+=cVelY;
      camera.heightOffset=BABYLON.Scalar.Clamp(camera.heightOffset,0,30);
      cVelX=0;cVelY=0;
    }

    // Camera collision with buildings
    const cp=camera.position, cr=1.5;
    for(const b of buildings){
      const bi=b.getBoundingInfo().boundingBox;const mn=bi.minimumWorld,mx=bi.maximumWorld;
      if(cp.x>mn.x-cr&&cp.x<mx.x+cr&&cp.y>mn.y-cr&&cp.y<mx.y+cr&&cp.z>mn.z-cr&&cp.z<mx.z+cr){
        const ds=[cp.x-mn.x,mx.x-cp.x,cp.y-mn.y,mx.y-cp.y,cp.z-mn.z,mx.z-cp.z];
        const md=Math.min(...ds);const idx=ds.indexOf(md);
        if(idx===0)camera.position.x=mn.x-cr;else if(idx===1)camera.position.x=mx.x+cr;
        else if(idx===2)camera.position.y=mn.y-cr;else if(idx===3)camera.position.y=mx.y+cr;
        else if(idx===4)camera.position.z=mn.z-cr;else camera.position.z=mx.z+cr;
      }
    }

    // ── PLAYER MOVEMENT ──
    let moving=false;
    const sprint=gameState.isSprinting&&(input["w"]||input["keyw"])?1.7:1;
    if(input["w"]||input["keyw"]){player.translate(BABYLON.Axis.Z,16*sprint*dt,BABYLON.Space.LOCAL);moving=true}
    if(input["s"]||input["keys"]){player.translate(BABYLON.Axis.Z,-11*sprint*dt,BABYLON.Space.LOCAL);moving=true}
    if(input["a"]||input["keya"]) player.rotation.y-=2.8*dt;
    if(input["d"]||input["keyd"]) player.rotation.y+=2.8*dt;

    // Speed lines when sprinting
    document.getElementById("speedLines").className="speed-lines"+(gameState.isSprinting&&moving?" active":"");

    // Footstep audio
    if(moving&&grounded){
      footstepTimer-=dt;
      if(footstepTimer<=0){
        AudioManager.play(gameState.isSprinting?'footstepRun':'footstepWalk', 0.2);
        footstepTimer=gameState.isSprinting?0.3:0.45;
      }
    }

    // Car driving
    if(playerCar){
      const car=playerCar;
      const fi=(input["w"]||input["keyw"])?1:(input["s"]||input["keys"])?-1:0;
      const si=(input["a"]||input["keya"])?-1:(input["d"]||input["keyd"])?1:0;
      if(fi>0) car.speed=Math.min(car.maxSpeed,car.speed+car.accel*dt);
      else if(fi<0) car.speed=Math.max(-car.maxSpeed*0.35,car.speed-car.accel*dt);
      else car.speed*=Math.max(0,1-dt*2.5);
      car.yaw+=si*(Math.max(0.5,Math.abs(car.speed)/car.maxSpeed))*dt*2.6;
      car.root.rotation.y=car.yaw;
      const fv=new BABYLON.Vector3(Math.sin(car.root.rotation.y),0,Math.cos(car.root.rotation.y));
      car.root.position.addInPlace(fv.scale(car.speed*dt*0.1));
      car.speed*=Math.max(0,1-dt*0.2);
      // Spin wheels
      car.wheels.forEach(w=>{w.rotation.x+=car.speed*dt*0.02});
      checkCarNpcCollisions(car);
      if(car.prompt)car.prompt.isVisible=false;
    }

    // Jump
    if((input[" "]||input["space"])&&grounded){
      velocityY=15;grounded=false;
      AudioManager.play('jump', 0.3);
    }
    velocityY+=-22*dt;player.position.y+=velocityY*dt;

    // Building collisions
    const prx=0.95,prz=0.7,ppx=player.position.x,ppz=player.position.z;
    const pMinY=player.position.y-GROUNDED_Y,pMaxY=player.position.y+2.5;
    for(const b of buildings){
      const bi=b.getBoundingInfo().boundingBox;const mn=bi.minimumWorld,mx=bi.maximumWorld;
      if(pMaxY<mn.y||pMinY>mx.y)continue;
      const ox=Math.min(ppx+prx,mx.x)-Math.max(ppx-prx,mn.x);
      const oz=Math.min(ppz+prz,mx.z)-Math.max(ppz-prz,mn.z);
      if(ox>0&&oz>0){
        if(ox<oz){if((ppx)>(mn.x+mx.x)/2)player.position.x+=ox+0.02;else player.position.x-=ox+0.02}
        else{if((ppz)>(mn.z+mx.z)/2)player.position.z+=oz+0.02;else player.position.z-=oz+0.02}
      }
    }

    // Ground check
    const feetY=player.position.y-GROUNDED_Y;
    let landed=false;
    if(velocityY<=0){
      for(const s of solidSurfaces){
        const bi=s.getBoundingInfo().boundingBox;const mn=bi.minimumWorld,mx=bi.maximumWorld;
        if(player.position.x+prx>=mn.x&&player.position.x-prx<=mx.x&&player.position.z+prz>=mn.z&&player.position.z-prz<=mx.z){
          if(feetY<=mx.y+0.25&&prevFeetY>=mx.y-1){
            player.position.y=mx.y+GROUNDED_Y;velocityY=0;grounded=true;landed=true;
            if(prevFeetY>mx.y+1) AudioManager.play('land', 0.3);
            break;
          }
        }
      }
    }
    if(!landed){if(player.position.y<=GROUNDED_Y){player.position.y=GROUNDED_Y;velocityY=0;grounded=true}else grounded=false}
    prevFeetY=feetY;

    // Animations
    if(moving&&grounded){
      walkTime+=dt*(gameState.isSprinting?13:9);
      leftLeg.rotation.x=Math.sin(walkTime)*0.8;rightLeg.rotation.x=-Math.sin(walkTime)*0.8;
      leftArm.rotation.x=-Math.sin(walkTime)*0.6;rightArm.rotation.x=Math.sin(walkTime)*0.6;
    } else {
      leftLeg.rotation.x*=0.85;rightLeg.rotation.x*=0.85;leftArm.rotation.x*=0.85;rightArm.rotation.x*=0.85;
    }
    if(!grounded){leftLeg.rotation.x=0;rightLeg.rotation.x=0;leftArm.rotation.x=-2.8;rightArm.rotation.x=-2.8}
    if(inventory[activeIndex]&&inventory[activeIndex].id!=="bomb"){rightArm.rotation.x=-1.5;rightArm.rotation.y=0}

    // ── BOMBS ──
    for(let i=bombs.length-1;i>=0;i--){
      const b=bombs[i];b.velocity.y+=-22*dt;b.position.addInPlace(b.velocity.scale(dt));
      b.rotation.x+=dt;b.rotation.y+=dt*0.5;b.life-=dt;
      if(b.position.y<=0.4){b.position.y=0.4;b.velocity.y*=-0.35;b.velocity.x*=0.5;b.velocity.z*=0.5}
      if(b.life<=0){explodeBombAt(b.position,30);try{b.dispose()}catch(e){};bombs.splice(i,1)}
    }

    // ── HEALTH KITS ──
    for(const sp of healthKitSpawns){
      if(sp.isActive){
        sp.kit.rotation.y+=dt*2; // Spin
        sp.kit.position.y=1+Math.sin(gameState.time*3)*0.3; // Bob
        sp.cross1.position.y=sp.kit.position.y+0.65;sp.cross1.rotation.y=sp.kit.rotation.y;
        sp.cross2.position.y=sp.kit.position.y+0.65;sp.cross2.rotation.y=sp.kit.rotation.y;
        if(BABYLON.Vector3.Distance(player.position,sp.kit.position)<3){
          if(gameState.health<100){
            gameState.health=Math.min(100,gameState.health+40);
            sp.kit.setEnabled(false);sp.cross1.setEnabled(false);sp.cross2.setEnabled(false);
            sp.isActive=false;sp.respawnTimer=20;
            AudioManager.play('healthPickup', 0.5);
          }
        }
      } else {
        sp.respawnTimer-=dt;
        if(sp.respawnTimer<=0){sp.kit.setEnabled(true);sp.cross1.setEnabled(true);sp.cross2.setEnabled(true);sp.kit.position.set(sp.x,1,sp.z);sp.cross1.position.set(sp.x,1.65,sp.z);sp.cross2.position.set(sp.x,1.65,sp.z);sp.isActive=true}
      }
    }

    // ── ARMOR SHOPS ──
    nearArmorShop=null;
    for(const shop of armorShops){
      const d=BABYLON.Vector3.Distance(player.position,shop.position);
      if(shop.prompt){
        const proj=BABYLON.Vector3.Project(shop.position,BABYLON.Matrix.Identity(),scene.getTransformMatrix(),camera.viewport.toGlobal(engine.getRenderWidth(),engine.getRenderHeight()));
        if(isFinite(proj.x)&&isFinite(proj.y)&&d<40){
          shop.prompt.isVisible=true;
          shop.prompt.left=proj.x-engine.getRenderWidth()/2+"px";
          shop.prompt.top=proj.y-engine.getRenderHeight()/2+"px";
        } else shop.prompt.isVisible=false;
      }
      if(d<4.5&&!playerCar){nearArmorShop=shop;if(shop.prompt)shop.prompt.background="rgba(255,0,255,0.2)"}
    }

    // ── NPCs ──
    for(let i=npcs.length-1;i>=0;i--){
      const n=npcs[i];
      updateNpcHealthBar(n);
      if(!n.velocity) n.velocity=new BABYLON.Vector3(0,0,0);
      if(typeof n.velocityY!=='number') n.velocityY=0;

      if(n.ragdoll){
        n.ragdollVel.y+=-22*dt;n.root.position.addInPlace(n.ragdollVel.scale(dt));
        n.root.position.y+=n.velocityY*dt;n.ragdollVel.scaleInPlace(0.96);n.velocityY+=-22*dt;
        const{la,ra,ll,rl}=n.limbs;
        if(la)la.rotation.x+=n.ragdollAng.la*dt;if(ra)ra.rotation.x+=n.ragdollAng.ra*dt;
        if(ll)ll.rotation.x+=n.ragdollAng.ll*dt;if(rl)rl.rotation.x+=n.ragdollAng.rl*dt;
        // Ground check for ragdoll
        const dr=new BABYLON.Ray(n.root.position.add(new BABYLON.Vector3(0,10,0)),new BABYLON.Vector3(0,-1,0),30);
        const dh=scene.pickWithRay(dr,m=>m===ground||solidSurfaces.indexOf(m)!==-1);
        if(dh&&dh.hit&&dh.pickedPoint){
          const sy=dh.pickedPoint.y+n.groundOffset*0.6;
          if(n.root.position.y<=sy){n.root.position.y=sy;n.ragdollVel.y=0;n.ragdollVel.scaleInPlace(0.7);
            n.ragdollAng.la*=0.96;n.ragdollAng.ra*=0.96;n.ragdollAng.ll*=0.96;n.ragdollAng.rl*=0.96}
        }
        if(n.ragdollDeathTime&&Date.now()-n.ragdollDeathTime>45000){disposeNpc(n)}
        continue;
      }

      n.velocityY+=-22*dt;n.velocityY=BABYLON.Scalar.Clamp(n.velocityY,-100,100);
      n.root.position.y+=n.velocityY*dt;

      // Ground snap
      const dr=new BABYLON.Ray(n.root.position.add(new BABYLON.Vector3(0,30,0)),new BABYLON.Vector3(0,-1,0),200);
      const dh=scene.pickWithRay(dr,m=>m===ground||solidSurfaces.indexOf(m)!==-1);
      if(dh&&dh.hit&&dh.pickedPoint&&isFinite(dh.pickedPoint.y)){
        if(n.root.position.y<=dh.pickedPoint.y+n.groundOffset+0.05){n.root.position.y=dh.pickedPoint.y+n.groundOffset;n.velocityY=0;n.grounded=true}
        else n.grounded=false;
      }

      // Police chase
      if(n.isPolice&&gameState.wantedLevel>0){
        n.dest=playerCar?playerCar.root.position.clone():player.position.clone();
        n.speed=20;
        if(!playerCar){
          const dp=BABYLON.Vector3.Distance(n.root.position,player.position);
          if(dp<5){n.attackCooldown-=dt;if(n.attackCooldown<=0){damagePlayer(12+gameState.wantedLevel*3);n.attackCooldown=1;AudioManager.play('policeShot',0.3)}}
        }
      } else if(!n.dest||Math.random()<0.006||BABYLON.Vector3.Distance(new BABYLON.Vector3(n.root.position.x,0,n.root.position.z),new BABYLON.Vector3(n.dest.x,0,n.dest.z))<0.7){
        n.dest=new BABYLON.Vector3(n.root.position.x+(Math.random()-0.5)*60,n.root.position.y,n.root.position.z+(Math.random()-0.5)*60);
      }

      // Move toward destination
      if(n.dest){
        const dx=n.dest.x-n.root.position.x,dz=n.dest.z-n.root.position.z;
        if(Math.abs(dx)>0.01||Math.abs(dz)>0.01){
          const ty=Math.atan2(dx,dz);
          let delta=shortAngle(n.root.rotation.y,ty);
          const mt=n.turnSpeed*dt*(n.speed/15);
          if(Math.abs(delta)<=mt) n.root.rotation.y=ty;
          else n.root.rotation.y+=BABYLON.Scalar.Clamp(delta,-mt,mt);
        }
        const dir=new BABYLON.Vector3(n.dest.x-n.root.position.x,0,n.dest.z-n.root.position.z);
        const dist=dir.length();
        if(dist>0.05){dir.normalize();n.root.position.addInPlace(dir.scale(n.speed*dt))}
      }

      // Knockback
      if(n.velocity.lengthSquared()>0.001){n.root.position.addInPlace(n.velocity.scale(dt));n.velocity.scaleInPlace(Math.max(0,1-dt*3))}

      // Limb animation
      const{la,ra,ll,rl}=n.limbs;
      const isMoving=n.dest&&Math.hypot(n.dest.x-n.root.position.x,n.dest.z-n.root.position.z)>0.1;
      if(n.grounded&&isMoving){
        n.walkTime+=dt*8;
        if(ll)ll.rotation.x=Math.sin(n.walkTime)*0.8;if(rl)rl.rotation.x=-Math.sin(n.walkTime)*0.8;
        if(la)la.rotation.x=-Math.sin(n.walkTime)*0.6;if(ra)ra.rotation.x=Math.sin(n.walkTime)*0.6;
      } else {
        if(ll)ll.rotation.x*=0.85;if(rl)rl.rotation.x*=0.85;if(la)la.rotation.x*=0.85;if(ra)ra.rotation.x*=0.85;
      }

      // Safety
      if(!isFinite(n.root.position.y))n.root.position.y=n.groundOffset;
      if(n.root.position.y>500)n.root.position.y=500;
      if(n.root.position.y<-50)n.root.position.y=n.groundOffset;
    }

    // ── CARS ──
    nearCar=null;
    for(const car of cars){
      const seatWorld=car.body.getAbsolutePosition();
      const proj=BABYLON.Vector3.Project(seatWorld,BABYLON.Matrix.Identity(),scene.getTransformMatrix(),camera.viewport.toGlobal(engine.getRenderWidth(),engine.getRenderHeight()));
      if(car.prompt&&isFinite(proj.x)&&isFinite(proj.y)){car.prompt.left=proj.x-engine.getRenderWidth()/2+"px";car.prompt.top=proj.y-engine.getRenderHeight()/2+"px"}
      const d=BABYLON.Vector3.Distance(player.position,car.root.position.add(car.body.position));
      if(d<CAR_ENTER_DIST&&!playerCar&&!car.occupant){nearCar=car;if(car.prompt){car.prompt.isVisible=true;car.prompt.background="rgba(255,0,255,0.2)"}}
      else{if(car.prompt&&!car.occupant)car.prompt.isVisible=false}
    }

    renderMinimap();
  });

  engine.runRenderLoop(()=>scene.render());
  window.addEventListener("resize",()=>engine.resize());
})();
</script>
</body>
</html>
