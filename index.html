<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Babylon.js World — Babylon City</title>
  <link rel="icon" type="image/png" href="Ignited fuse with fiery explosion.png">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #1a1a1a; font-family: Arial, Helvetica, sans-serif; }
    #renderCanvas { width:100%; height:100%; touch-action:none; display:block; }
    
    /* GTA5-Style HUD */
    #hudMoney { position: absolute; top: 20px; right: 20px; font-size: 24px; color: #7FFF00; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 5px; font-weight: bold; }
    #hudHealth { position: absolute; top: 20px; left: 20px; font-size: 14px; color: white; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 5px; }
    #hudArmor { position: absolute; top: 50px; left: 20px; font-size: 14px; color: #87CEEB; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 5px; }
    #hudWanted { position: absolute; top: 80px; right: 20px; font-size: 18px; color: #FF6B6B; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 5px; font-weight: bold; }
    #hudAmmo { position: absolute; bottom: 120px; right: 20px; font-size: 16px; color: #FFD700; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 5px; }
    
    /* Minimap */
    #minimap { position: absolute; bottom: 20px; left: 20px; width: 160px; height: 160px; background: rgba(0,0,0,0.7); border: 2px solid #7FFF00; border-radius: 8px; }
    
    /* Hotbar */
    #hudHotbar { position: absolute; bottom: 22px; right: 22px; display:flex; gap:8px; z-index:9999; user-select:none; }
    .hotbar-slot { width:64px; height:48px; border-radius:8px; border:2px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5); color: white; display:flex; align-items:center; justify-content:center; flex-direction: column; font-size:18px; cursor:pointer; transition: all 0.2s; }
    .hotbar-slot.active { background: rgba(127,255,0,0.3); border-color: #7FFF00; box-shadow: 0 0 10px rgba(127,255,0,0.5); }
    .hotbar-slot:hover { border-color: rgba(255,255,255,0.6); }
    
    #hint { position:absolute; left:20px; bottom:22px; color:white; z-index:9999; background: rgba(0,0,0,0.7); padding:10px 12px; border-radius:8px; font-family:monospace; font-size:11px; border-left: 3px solid #7FFF00; max-width: 400px; }
    #crosshair { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; pointer-events: none; z-index: 9998; display: none; }
    .crosshair-line { position: absolute; background: rgba(255, 100, 100, 0.8); }
    .crosshair-h { width: 12px; height: 2px; top: 50%; left: 50%; transform: translateX(-50%); margin-top: -1px; }
    .crosshair-v { width: 2px; height: 12px; left: 50%; top: 50%; transform: translateY(-50%); margin-left: -1px; }

    /* Main Menu Styles */
    #mainMenu {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #111111 0%, #000000 50%, #111111 100%);
      z-index: 10001;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    #mainMenu.hidden {
      display: none;
    }

    .menu-container {
      text-align: center;
      padding: 40px;
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.7);
      border: 4px solid #ff00ff;
      box-shadow: 0 0 50px rgba(255, 0, 255, 0.5), inset 0 0 30px rgba(127, 255, 0, 0.1);
      animation: menuPulse 3s infinite;
    }

    @keyframes menuPulse {
      0%, 100% { box-shadow: 0 0 50px rgba(255, 0, 255, 0.5), inset 0 0 30px rgba(255, 0, 255, 0.1); }
      50% { box-shadow: 0 0 80px rgba(255, 0, 255, 0.8), inset 0 0 50px rgba(255, 0, 255, 0.2); }
    }

    .game-title {
      font-size: 72px;
      font-weight: bold;
      color: #ff4ccc;
      margin: 0 0 20px 0;
      text-shadow: 0 0 20px rgba(127, 255, 0, 0.8), 0 0 40px rgba(255, 0, 0, 0.4);
      letter-spacing: 4px;
      font-family: Arial Black, sans-serif;
      animation: titleGlow 2s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 20px rgba(255, 0, 255, 0.8), 0 0 40px rgba(255, 0, 255, 0.4); }
      50% { text-shadow: 0 0 40px rgba(255, 0, 255, 1), 0 0 60px rgba(255, 0, 255, 0.6); }
    }

    .game-subtitle {
      font-size: 24px;
      color: #FF6B6B;
      margin: 0 0 50px 0;
      letter-spacing: 3px;
      text-shadow: 0 0 10px rgba(255, 107, 107, 0.8);
      font-style: italic;
    }

    .start-button {
      padding: 20px 60px;
      font-size: 32px;
      font-weight: bold;
      background: linear-gradient(135deg, #7FFF00 0%, #90EE90 100%);
      color: #000;
      border: 3px solid #7FFF00;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(127, 255, 0, 0.6);
      font-family: Arial Black, sans-serif;
    }

    .start-button:hover {
      background: linear-gradient(135deg, #90EE90 0%, #7FFF00 100%);
      box-shadow: 0 0 40px rgba(127, 255, 0, 1), 0 0 20px rgba(255, 255, 255, 0.5);
      transform: scale(1.08);
    }

    .start-button:active {
      transform: scale(0.95);
    }

    /* Death Popup Styles */
    #deathPopup {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      background: rgba(0, 0, 0, 0.95);
      border: 4px solid #FF0000;
      border-radius: 15px;
      padding: 60px 80px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
    }

    #deathPopup .death-text {
      font-size: 120px;
      font-weight: bold;
      color: #FF0000;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 40px rgba(255, 0, 0, 0.6);
      margin: 0;
      letter-spacing: 8px;
      font-family: Arial Black, sans-serif;
    }

    #deathPopup .death-button {
      margin-top: 40px;
      padding: 18px 50px;
      font-size: 28px;
      font-weight: bold;
      background: #FF0000;
      color: white;
      border: 3px solid #FF0000;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 3px;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
    }

    #deathPopup .death-button:hover {
      background: #CC0000;
      box-shadow: 0 0 30px rgba(255, 0, 0, 1);
      transform: scale(1.05);
    }

    #deathPopup .death-button:active {
      transform: scale(0.95);
    }

    /* Semi-transparent overlay behind popup */
    #deathOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
    }

    /* Armor Shop Menu Styles */
    #armorShopMenu {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      background: rgba(0, 0, 0, 0.95);
      border: 4px solid #87CEEB;
      border-radius: 15px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 0 50px rgba(135, 206, 235, 0.8);
    }

    #armorShopMenu .shop-title {
      font-size: 48px;
      font-weight: bold;
      color: #87CEEB;
      margin: 0 0 30px 0;
      text-shadow: 0 0 20px rgba(135, 206, 235, 0.8);
      letter-spacing: 2px;
      font-family: Arial Black, sans-serif;
    }

    .armor-option {
      margin: 15px 0;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(135deg, #444 0%, #222 100%);
      color: white;
      border: 2px solid #87CEEB;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(135, 206, 235, 0.4);
    }

    .armor-option:hover {
      background: linear-gradient(135deg, #555 0%, #333 100%);
      box-shadow: 0 0 20px rgba(135, 206, 235, 0.8);
      transform: scale(1.05);
    }

    .armor-option:active {
      transform: scale(0.95);
    }

    .armor-price {
      font-size: 14px;
      color: #7FFF00;
      margin-top: 5px;
    }

    #armorShopOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
    }

    /* Aiming zoom overlay */
    .scope-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.8) 100%);
      z-index: 9997;
      pointer-events: none;
    }

    .scope-overlay.active {
      display: block;
    }
  </style>
</head>
<body>
<div id="mainMenu">
  <div class="menu-container">
    <h1 class="game-title">BJW-BABYLON CITY</h1>
    <p class="game-subtitle">Enter the Chaos</p>
    <button class="start-button" onclick="startGame()">START GAME</button>
  </div>
</div>

<canvas id="renderCanvas"></canvas>
<div id="deathOverlay"></div>
<div id="deathPopup">
  <div class="death-text">DEAD!</div>
  <button class="death-button" onclick="reloadGame()">RELOAD</button>
</div>
<div id="armorShopOverlay"></div>
<div id="armorShopMenu">
  <div class="shop-title">ARMOR SHOP</div>
  <button class="armor-option" onclick="buyArmor(25, 100)">
    BASIC ARMOR
    <div class="armor-price">$100</div>
  </button>
  <button class="armor-option" onclick="buyArmor(50, 250)">
    STANDARD ARMOR
    <div class="armor-price">$250</div>
  </button>
  <button class="armor-option" onclick="buyArmor(100, 500)">
    ELITE ARMOR
    <div class="armor-price">$500</div>
  </button>
  <button class="armor-option" onclick="closeArmorShop()" style="margin-top: 30px; background: linear-gradient(135deg, #8B0000 0%, #660000 100%); border-color: #FF6B6B;">
    CANCEL
  </button>
</div>
<div id="hudHealth">Health: <span id="healthVal">100</span>%</div>
<div id="hudArmor">Armor: <span id="armorVal">0</span>%</div>
<div id="hudMoney">$ <span id="moneyVal">0</span></div>
<div id="hudWanted">
  <span id="wantedStars">☆☆☆☆☆</span><br>
  <span id="wantedTimer" style="font-size:12px;">0s</span>
</div>
<div id="hudAmmo"><span id="ammoVal">∞</span> / <span id="ammoTypeVal">Gun</span></div>
<canvas id="minimap"></canvas>
<div id="hudHotbar"></div>
<div id="crosshair">
  <div class="crosshair-line crosshair-h"></div>
  <div class="crosshair-line crosshair-v"></div>
</div>
<div class="scope-overlay" id="scopeOverlay"></div>
<div id="hint">1-5: Weapons  •  E: Vehicle/Shop  •  Space: Jump  •  Shift: Sprint  •  Right Click: Aim  •  Click to fire</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
<script>
window.startGame = function() {
  const mainMenu = document.getElementById("mainMenu");
  mainMenu.classList.add("hidden");
};

window.reloadGame = function() {
  location.reload();
};

window.buyArmor = function(amount, cost) {
  if (gameState.money >= cost) {
    gameState.money -= cost;
    gameState.armor = Math.min(100, gameState.armor + amount);
    closeArmorShop();
  } else {
    alert("Not enough money! You need $" + cost);
  }
};

window.closeArmorShop = function() {
  document.getElementById("armorShopMenu").style.display = "none";
  document.getElementById("armorShopOverlay").style.display = "none";
};

window.openArmorShop = function() {
  document.getElementById("armorShopMenu").style.display = "block";
  document.getElementById("armorShopOverlay").style.display = "block";
};

(() => {
  try {
    // GTA5 Game State
    const gameState = {
      money: 0,
      health: 100,
      armor: 0,
      wantedLevel: 0,
      wantedTimer: 0,
      isSprinting: false,
      isDead: false,
      isAiming: false
    };

    window.gameState = gameState;

    // Death popup function
    function showDeathScreen() {
      gameState.isDead = true;
      document.getElementById("deathPopup").style.display = "block";
      document.getElementById("deathOverlay").style.display = "block";
    }

    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: false, stencil: true });
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color3(0.53, 0.81, 0.92);
    const ui = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

    const camera = new BABYLON.FollowCamera("cam", new BABYLON.Vector3(0, 12, -30), scene);
    camera.radius = 24;
    camera.heightOffset = 8;
    camera.rotationOffset = 180;
    camera.attachControl(canvas, true);

    const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.4, -1, -0.3), scene);
    sun.intensity = 0.7;
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
    hemi.intensity = 0.35;

    const sky = BABYLON.MeshBuilder.CreateSphere("sky", { diameter: 2000 }, scene);
    const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
    skyMat.backFaceCulling = false;
    skyMat.emissiveColor = new BABYLON.Color3(0.53, 0.81, 0.92);
    sky.material = skyMat;

    const cloudTex = new BABYLON.DynamicTexture("clouds", 512, scene);
    const ctxCloud = cloudTex.getContext();
    ctxCloud.clearRect(0,0,512,512);
    ctxCloud.fillStyle = "rgba(255,255,255,0.72)";
    for (let i=0;i<40;i++){
      ctxCloud.beginPath();
      ctxCloud.arc(Math.random()*512, Math.random()*512, 40+Math.random()*30, 0, Math.PI*2);
      ctxCloud.fill();
    }
    cloudTex.update();
    const cloudMat = new BABYLON.StandardMaterial("cloudMat", scene);
    cloudMat.opacityTexture = cloudTex;
    cloudMat.diffuseColor = BABYLON.Color3.White();
    cloudMat.backFaceCulling = false;
    cloudMat.disableLighting = true;
    const clouds = BABYLON.MeshBuilder.CreatePlane("clouds", { size: 1200 }, scene);
    clouds.rotation.x = Math.PI/2;
    clouds.position.y = 400;
    clouds.material = cloudMat;

    const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 2000, height: 2000 }, scene);
    const TILE_SIZE = 512;
    const tileTex = new BABYLON.DynamicTexture("asphaltTile", { width: TILE_SIZE, height: TILE_SIZE }, scene, false);
    const tctx = tileTex.getContext();
    const tw = TILE_SIZE, th = TILE_SIZE;
    tctx.fillStyle = "#2a2a2a";
    tctx.fillRect(0,0,tw,th);
    const gridCount = 8;
    const cellW = Math.floor(tw / gridCount);
    const cellH = Math.floor(th / gridCount);
    const inset = 4;
    for (let gx=0; gx<gridCount; gx++){
      for (let gy=0; gy<gridCount; gy++){
        const gVal = 35 + Math.floor(Math.random()*15);
        const rVal = 30 + Math.floor(Math.random()*10);
        const bVal = 30 + Math.floor(Math.random()*10);
        tctx.fillStyle = `rgb(${rVal},${gVal},${bVal})`;
        const x = gx*cellW + inset;
        const y = gy*cellH + inset;
        tctx.fillRect(x,y,cellW-inset*2,cellH-inset*2);
      }
    }
    tctx.strokeStyle = "rgba(255,255,200,0.4)";
    tctx.lineWidth = 3;
    for (let i = 0; i < 8; i += 2) {
      tctx.beginPath();
      tctx.moveTo(i * cellW, 0);
      tctx.lineTo(i * cellW, th);
      tctx.stroke();
      tctx.beginPath();
      tctx.moveTo(0, i * cellH);
      tctx.lineTo(tw, i * cellH);
      tctx.stroke();
    }
    tileTex.update();
    tileTex.wrapU = tileTex.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
    const asphaltMat = new BABYLON.StandardMaterial("asphalt", scene);
    asphaltMat.diffuseTexture = tileTex;
    asphaltMat.diffuseTexture.uScale = asphaltMat.diffuseTexture.vScale = 4;
    asphaltMat.specularColor = new BABYLON.Color3(0.1,0.1,0.1);
    ground.material = asphaltMat;

    const particleTex = new BABYLON.DynamicTexture('particleTex', 64, scene, false);
    const pctx = particleTex.getContext();
    pctx.clearRect(0,0,64,64);
    const grad = pctx.createRadialGradient(32,32,2,32,32,30);
    grad.addColorStop(0,'rgba(255,255,255,1)');
    grad.addColorStop(0.6,'rgba(255,255,255,0.6)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    pctx.fillStyle = grad;
    pctx.fillRect(0,0,64,64);
    particleTex.update();

    const player = new BABYLON.TransformNode("player", scene);
    const GROUNDED_Y = 3;
    player.position.y = GROUNDED_Y;

    const torso = BABYLON.MeshBuilder.CreateBox("torso", { width:2, height:2, depth:1 }, scene);
    torso.parent = player; torso.position.set(0,0,0);
    const head = BABYLON.MeshBuilder.CreateBox("head", { size:1.5 }, scene); head.parent = torso; head.position.set(0,1.8,0);

    const leftArm = BABYLON.MeshBuilder.CreateBox("lArm", { height:2, width:0.8, depth:0.8 }, scene);
    leftArm.setPivotPoint(new BABYLON.Vector3(0,1,0));
    leftArm.parent = torso; leftArm.position.set(-1.4,0,0);

    const rightArm = leftArm.clone("rArm");
    rightArm.setPivotPoint(new BABYLON.Vector3(0,1,0)); rightArm.parent = torso; rightArm.position.set(1.4,0,0);

    const leftLeg = BABYLON.MeshBuilder.CreateBox("lLeg", { height:2, width:0.9, depth:0.9 }, scene);
    leftLeg.setPivotPoint(new BABYLON.Vector3(0,1,0)); leftLeg.parent = torso; leftLeg.position.set(-0.5,-1.9,0);

    const rightLeg = leftLeg.clone("rLeg"); rightLeg.setPivotPoint(new BABYLON.Vector3(0,1,0)); rightLeg.parent = torso; rightLeg.position.set(0.5,-1.9,0);

    const bodyMat = new BABYLON.StandardMaterial("body", scene); bodyMat.diffuseColor = new BABYLON.Color3(1,1,1);
    [torso, head, leftArm, rightArm, leftLeg, rightLeg].forEach(m=>m.material = bodyMat);
    camera.lockedTarget = torso;

    canvas.addEventListener("click", () => {
      canvas.requestPointerLock = canvas.requestPointerLock || canvas.msRequestPointerLock || canvas.mozRequestPointerLock || canvas.webkitRequestPointerLock;
      if (canvas.requestPointerLock) canvas.requestPointerLock();
    });
    
    let mouseSensitivity = 0.0025;
    let cameraVelocityX = 0;
    let cameraVelocityY = 0;
    
    scene.onPointerObservable.add((pointerInfo) => {
      if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERMOVE) {
        if (document.pointerLockElement === canvas) {
          const evt = pointerInfo.event;
          const dx = evt.movementX || 0;
          const dy = evt.movementY || 0;
          cameraVelocityX = dx * mouseSensitivity;
          cameraVelocityY = -dy * 0.05;
        }
      }
    });

    const input = {};
    let nearCar = null;
    let nearArmorShop = null;

    scene.onKeyboardObservable.add(kb => {
      const key = (kb.event && (kb.event.code || kb.event.key)) ? (kb.event.code || kb.event.key) : '';
      const keyLower = (kb.event && kb.event.key) ? kb.event.key.toLowerCase() : key;
      if (kb.type === BABYLON.KeyboardEventTypes.KEYDOWN) {
        if (key === "Space" || keyLower === " ") input[" "] = true;
        if (key === "ShiftLeft" || key === "ShiftRight" || keyLower === "shift") {
          gameState.isSprinting = true;
        }
        input[keyLower] = true;
        if (key === "Digit1") setActiveIndex(0);
        if (key === "Digit2") setActiveIndex(1);
        if (key === "Digit3") setActiveIndex(2);
        if (key === "Digit4") setActiveIndex(3);
        if (key === "Digit5") setActiveIndex(4);
        if (keyLower === "f" || keyLower === "g") attemptUse();
        if (keyLower === "e") {
          if (playerCar) { exitCar(); }
          else if (nearCar) { enterCar(nearCar); }
          else if (nearArmorShop) { openArmorShop(); }
        }
      } else if (kb.type === BABYLON.KeyboardEventTypes.KEYUP) {
        if (key === "Space" || keyLower === " ") input[" "] = false;
        if (key === "ShiftLeft" || key === "ShiftRight" || keyLower === "shift") {
          gameState.isSprinting = false;
        }
        input[keyLower] = false;
      }
    });

    // Right-click aiming
    document.addEventListener("mousedown", (e) => {
      if (e.button === 2) { // Right mouse button
        const it = inventory[activeIndex];
        if (it && it.id !== "bomb") {
          gameState.isAiming = true;
          document.getElementById("scopeOverlay").classList.add("active");
          camera.radius = 8;
          camera.heightOffset = 3;
        }
      }
    });

    document.addEventListener("mouseup", (e) => {
      if (e.button === 2) {
        gameState.isAiming = false;
        document.getElementById("scopeOverlay").classList.remove("active");
        camera.radius = 24;
        camera.heightOffset = 8;
      }
    });

    document.addEventListener("contextmenu", (e) => e.preventDefault());

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (e.deltaY > 0) setActiveIndex((activeIndex + 1) % inventory.length);
      else setActiveIndex((activeIndex - 1 + inventory.length) % inventory.length);
    }, { passive:false });

    const buildings = [];
    const buildingMat1 = new BABYLON.StandardMaterial("buildMat1", scene); buildingMat1.diffuseColor = new BABYLON.Color3(0.7,0.7,0.75);
    const buildingMat2 = new BABYLON.StandardMaterial("buildMat2", scene); buildingMat2.diffuseColor = new BABYLON.Color3(0.6,0.65,0.7);
    const buildingMat3 = new BABYLON.StandardMaterial("buildMat3", scene); buildingMat3.diffuseColor = new BABYLON.Color3(0.8,0.75,0.7);
    const skyscraperMat = new BABYLON.StandardMaterial("skyscraperMat", scene); skyscraperMat.diffuseColor = new BABYLON.Color3(0.3,0.3,0.35);

    function updateNpcHealthBar(n) {
      if (!n || !n.healthBar || !n.torso) return;
      const headWorldPos = n.torso.getAbsolutePosition().add(new BABYLON.Vector3(0, 1.5, 0));
      const proj = BABYLON.Vector3.Project(headWorldPos, BABYLON.Matrix.Identity(), scene.getTransformMatrix(), camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight()));
      if (!isFinite(proj.x) || !isFinite(proj.y)) { n.healthBar.bg.isVisible = false; return; }
      n.healthBar.bg.isVisible = true;
      n.healthBar.bg.left = proj.x - engine.getRenderWidth()/2 + "px";
      n.healthBar.bg.top  = proj.y - engine.getRenderHeight()/2 - 30 + "px";
      const pct = Math.max(0, Math.min(1, (n.health || n.maxHealth) / (n.maxHealth || 100)));
      const px = Math.max(0, Math.floor(n.healthBar.width * pct));
      n.healthBar.fill.width = px + "px";
      if (pct > 0.6) n.healthBar.fill.background = "green";
      else if (pct > 0.25) n.healthBar.fill.background = "yellow";
      else n.healthBar.fill.background = "red";
    }

    function damageNpc(n, dmg) {
      if (!n || n.ragdoll) return;
      if (typeof n.health !== "number") n.health = n.maxHealth || 100;
      n.health -= dmg;
      if (n.health <= 0) { n.health = 0; killNpc(n); }
    }

    function damagePlayer(dmg) {
      if (gameState.isDead) return;
      if (gameState.armor > 0) {
        const armorAbsorb = Math.min(dmg * 0.75, gameState.armor);
        gameState.armor -= armorAbsorb;
        dmg -= armorAbsorb;
      }
      gameState.health -= dmg;
      if (gameState.health <= 0) {
        gameState.health = 0;
        showDeathScreen();
      }
    }

    function respawnPlayer() {
      gameState.health = 100;
      gameState.armor = 0;

      gameState.wantedTimer = 0;

    function killNpc(n) {
      if (!n || n.ragdoll) return;

      if (!n.isPolice) {

        n.root.dispose();

      const idx = npcs.indexOf(n); if (idx >= 0) npcs.splice(idx, 1);

      const it = inventory[activeIndex];

      const b = BABYLON.MeshBuilder.CreateSphere(`bomb_${Date.now()}`, { diameter:1.8 }, scene);

    function fireGun() {
      const it = inventory[activeIndex];
      if (!it || it.id === "bomb") return;
      if (gunCooldown > 0) return;
      
      const fireRate = it.fireRate;
      const damage = it.damage;
      const spread = gameState.isAiming ? it.spread * 0.3 : it.spread;
      const pellets = it.pellets;
      
      gunCooldown = fireRate;

      const barrelWorldPos = gun.gunBarrel.getAbsolutePosition();
      const forward = playerForward();
      
      const flash = BABYLON.MeshBuilder.CreateSphere("gunFlash_"+Date.now(), { diameter:0.8 }, scene);
      const flashMat = new BABYLON.StandardMaterial("gunFlashMat_"+Date.now(), scene);
      flashMat.emissiveColor = new BABYLON.Color3(1, 0.8, 0.2);
      flashMat.alpha = 0.9;
      flashMat.disableLighting = true;
      flash.material = flashMat;
      flash.position = barrelWorldPos.add(forward.scale(1.5));

      let flashTime = 0;
      const flashObs = scene.onBeforeRenderObservable.add(() => {
        flashTime += engine.getDeltaTime()/1000;
        flashMat.alpha = Math.max(0, 0.9*(1-flashTime/0.12));
        if (flashTime > 0.12) {
          try { flash.dispose(); } catch(e) {}
          scene.onBeforeRenderObservable.remove(flashObs);
        }
      });

      for (let p = 0; p < pellets; p++) {
        const spreadX = (Math.random() - 0.5) * spread;
        const spreadY = (Math.random() - 0.5) * spread;
        
        const screenX = engine.getRenderWidth() / 2 + spreadX * 100;
        const screenY = engine.getRenderHeight() * 0.3 + spreadY * 100;
        
        const hit = scene.pick(screenX, screenY, (m) => {
          for (const npc of npcs) {
            const npcMeshes = npc.root.getChildMeshes();
            if (npcMeshes.includes(m)) return true;
          }
          return false;
        });

        if (hit && hit.hit && hit.pickedMesh) {
          for (const npc of npcs) {
            if (npc.root.getChildMeshes().includes(hit.pickedMesh)) {
              damageNpc(npc, damage);
              if (!npc.isPolice) increaseWantedLevel(0.5);
              break;
            }
          }
        }
      }
    }

        const d = BABYLON.Vector3.Distance(player.position, shopPos);
        
        if (shop.prompt) {
          const proj = BABYLON.Vector3.Project(shopPos, BABYLON.Matrix.Identity(), scene.getTransformMatrix(), camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight()));
          if (isFinite(proj.x) && isFinite(proj.y)) {
            shop.prompt.isVisible = true;
            shop.prompt.left = proj.x - engine.getRenderWidth()/2 + "px";
            shop.prompt.top = proj.y - engine.getRenderHeight()/2 + "px";
          } else {
            shop.prompt.isVisible = false;
          }
        }
        
        const SHOP_DISTANCE = 4.0;
        if (d < SHOP_DISTANCE && !playerCar) {
          nearArmorShop = shop;
          if (shop.prompt) {
            shop.prompt.isVisible = true;
            shop.prompt.background = "rgba(0,0,0,0.75)";
          }
        }
      }

      for (let i = npcs.length - 1; i >= 0; i--) {
        const n = npcs[i];
        updateNpcHealthBar(n);

        if (typeof n.velocityY !== 'number' || !isFinite(n.velocityY)) n.velocityY = 0;
        if (!n.groundOffset || !isFinite(n.groundOffset)) n.groundOffset = GROUNDED_Y;
        if (!n.velocity || !(n.velocity instanceof BABYLON.Vector3)) n.velocity = new BABYLON.Vector3(0,0,0);
        if (!n.limbs) n.limbs = {};

        if (n.ragdoll) {
          n.ragdollVel.y += GRAVITY * dt;
          n.root.position.addInPlace(n.ragdollVel.scale(dt));
          n.root.position.y += n.velocityY * dt;
          n.ragdollVel.scaleInPlace(0.96);
          n.velocityY += GRAVITY * dt;
          const limbs = n.limbs || {};
          if (limbs.la) limbs.la.rotation.x += n.ragdollAng.la * dt;
          if (limbs.ra) limbs.ra.rotation.x += n.ragdollAng.ra * dt;
          if (limbs.ll) limbs.ll.rotation.x += n.ragdollAng.ll * dt;
          if (limbs.rl) limbs.rl.rotation.x += n.ragdollAng.rl * dt;

          const downFromR = n.root.position.add(new BABYLON.Vector3(0, 10, 0));
          const rayR = new BABYLON.Ray(downFromR, new BABYLON.Vector3(0, -1, 0), 30);
          const hitR = scene.pickWithRay(rayR, (m) => m === ground || solidSurfaces.indexOf(m) !== -1);
          if (hitR && hitR.hit && hitR.pickedPoint && isFinite(hitR.pickedPoint.y)) {
            const settleY = hitR.pickedPoint.y + n.groundOffset * 0.6;
            if (n.root.position.y <= settleY) {
              n.root.position.y = settleY;
              n.ragdollVel.y = 0;
              n.ragdollAng.la *= 0.96; n.ragdollAng.ra *= 0.96; n.ragdollAng.ll *= 0.96; n.ragdollAng.rl *= 0.96;
              n.ragdollVel.scaleInPlace(0.7);
            }
          }

          if (n.ragdollDeathTime && (Date.now() - n.ragdollDeathTime) > 60000) {
            disposeNpc(n);
            continue;
          }
          continue;
        }

        n.velocityY += GRAVITY * dt;
        n.velocityY = Math.max(-120, Math.min(120, n.velocityY));
        n.root.position.y += n.velocityY * dt;

        const downFrom = n.root.position.add(new BABYLON.Vector3(0,30,0));
        const downRay = new BABYLON.Ray(downFrom, new BABYLON.Vector3(0,-1,0), 200);
        const downRes = scene.pickWithRay(downRay, (m) => m === ground || solidSurfaces.indexOf(m) !== -1);
        if (downRes && downRes.hit && downRes.pickedPoint && isFinite(downRes.pickedPoint.y)) {
          const surfaceY = downRes.pickedPoint.y;
          if (n.root.position.y <= surfaceY + n.groundOffset + 0.05) { n.root.position.y = surfaceY + n.groundOffset; n.velocityY = 0; n.grounded = true; }
          else n.grounded = false;
        }        if (n.isPolice && gameState.wantedLevel > 0) {
          // If player is in a car, target the car instead
          if (playerCar) {
            n.dest = playerCar.root.position.clone();
          } else {
            n.dest = player.position.clone();
          }
          n.speed = 18.0;

          // Police can only attack if player is NOT in a car
          if (!n.ragdoll && !playerCar) {
            const distToPlayer = BABYLON.Vector3.Distance(n.root.position, player.position);
            if (distToPlayer < 5.0) {
              n.attackCooldown -= dt;
              if (n.attackCooldown <= 0) {
                damagePlayer(15);
                n.attackCooldown = 1.2;
              }
            }
          }
        } else if (!n.dest || Math.random() < 0.006 || BABYLON.Vector3.Distance(new BABYLON.Vector3(n.root.position.x,0,n.root.position.z), new BABYLON.Vector3(n.dest.x,0,n.dest.z)) < 0.7) {
          const rx = n.root.position.x + (Math.random() - 0.5) * 60;
          const rz = n.root.position.z + (Math.random() - 0.5) * 60;
          const from = new BABYLON.Vector3(rx, 60, rz);
          const to = new BABYLON.Vector3(rx, -20, rz);
          const ray = new BABYLON.Ray(from, to.subtract(from).normalize(), 200);
          const rayRes = scene.pickWithRay(ray, (m) => m === ground || solidSurfaces.indexOf(m) !== -1);
          let ty = n.root.position.y - n.groundOffset;
          if (rayRes && rayRes.hit && rayRes.pickedPoint && isFinite(rayRes.pickedPoint.y)) ty = rayRes.pickedPoint.y;
          n.dest = new BABYLON.Vector3(rx, ty + n.groundOffset, rz);
        }

        if (n.dest) {
          const dx = n.dest.x - n.root.position.x;
          const dz = n.dest.z - n.root.position.z;
          if (Math.abs(dx) > 0.0001 || Math.abs(dz) > 0.0001) {
            const targetYaw = Math.atan2(dx, dz);
            const curYaw = (typeof n.root.rotation.y === "number") ? n.root.rotation.y : 0;
            let delta = shortestAngleDelta(curYaw, targetYaw);
            const maxTurn = (n.turnSpeed || NPC_TURN_SPEED) * dt * (n.speed / 15.0);
            if (Math.abs(delta) <= maxTurn || Math.hypot(dx, dz) < 0.6) {
              n.root.rotation.y = targetYaw;
            } else {
              if (delta > 0) delta = Math.min(delta, maxTurn);
              else delta = Math.max(delta, -maxTurn);
              n.root.rotation.y = curYaw + delta;
            }
          }

          const horizontalHere = new BABYLON.Vector3(n.root.position.x,0,n.root.position.z);
          const horizontalDest = new BABYLON.Vector3(n.dest.x,0,n.dest.z);
          const dir = horizontalDest.subtract(horizontalHere);
          const dist = dir.length();
          if (dist > 0.05) {
            dir.normalize();
            n.root.position.addInPlace(dir.scale(n.speed * dt));
          }
        }

        const downFrom2 = n.root.position.add(new BABYLON.Vector3(0, 30, 0));
        const downRay2 = new BABYLON.Ray(downFrom2, new BABYLON.Vector3(0, -1, 0), 200);
        const r2 = scene.pickWithRay(downRay2, (m) => m === ground || solidSurfaces.indexOf(m) !== -1);
        if (r2 && r2.hit && r2.pickedPoint && isFinite(r2.pickedPoint.y)) { n.root.position.y = r2.pickedPoint.y + n.groundOffset; n.velocityY = 0; n.grounded = true; }

        if (!isFinite(n.root.position.y)) n.root.position.y = n.groundOffset;
        if (n.root.position.y > 500) n.root.position.y = 500;
        if (n.root.position.y < -50) n.root.position.y = n.groundOffset;

        if (n.velocity && typeof n.velocity.lengthSquared === "function" && n.velocity.lengthSquared() > 0.001) {
          if (!isFinite(n.velocity.x) || !isFinite(n.velocity.y) || !isFinite(n.velocity.z)) n.velocity = new BABYLON.Vector3(0,0,0);
          else { n.root.position.addInPlace(n.velocity.scale(dt)); n.velocity = n.velocity.scale(Math.max(0, 1 - dt*2.8)); }
        }

        try {
          const { la, ra, ll, rl } = n.limbs;
          let movingHorizontally = false;
          if (n.dest) {
            const dx = n.dest.x - n.root.position.x;
            const dz = n.dest.z - n.root.position.z;
            movingHorizontally = Math.hypot(dx, dz) > 0.1;
          }

          if (n.grounded && movingHorizontally) {
            n.walkTime += dt * 8;
            const wt = n.walkTime;
            if (ll) ll.rotation.x = Math.sin(wt) * 0.8;
            if (rl) rl.rotation.x = -Math.sin(wt) * 0.8;
            if (la) la.rotation.x = -Math.sin(wt) * 0.6;
            if (ra) ra.rotation.x = Math.sin(wt) * 0.6;
          } else {
            if (ll) ll.rotation.x *= 0.8;
            if (rl) rl.rotation.x *= 0.8;
            if (la) la.rotation.x *= 0.8;
            if (ra) ra.rotation.x *= 0.8;
          }
        } catch(e) {
          // ignore disposed meshes
        }
      }

      nearCar = null;
      for (let i=0;i<cars.length;i++){
        const car = cars[i];
        const seatWorld = car.body.getAbsolutePosition().add(BABYLON.Vector3.TransformCoordinates(car.seatLocal, car.body.getWorldMatrix()));
        const proj = BABYLON.Vector3.Project(seatWorld, BABYLON.Matrix.Identity(), scene.getTransformMatrix(), camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight()));
        if (car.prompt && isFinite(proj.x) && isFinite(proj.y)) {
          car.prompt.isVisible = true;
          car.prompt.left = proj.x - engine.getRenderWidth()/2 + "px";
          car.prompt.top = proj.y - engine.getRenderHeight()/2 + "px";
        } else if (car.prompt) {
          car.prompt.isVisible = false;
        }

        const d = BABYLON.Vector3.Distance(player.position, car.root.position.add(car.body.position));
        if (d < CAR_ENTER_DISTANCE && !playerCar && !car.occupant) {
          nearCar = car;
          if (car.prompt) car.prompt.isVisible = true;
          if (car.prompt) car.prompt.background = "rgba(0,0,0,0.75)";
        } else {
          if (car.prompt && !car.occupant) car.prompt.isVisible = false;
        }
      }

      if (playerCar) {
        checkCarNpcCollisions(playerCar, dt);
      }

      renderMinimap();
    });

    window.addEventListener("beforeunload", () => { 
      try { hudHotbar.remove(); } catch(e){}; 
      npcs.forEach(n => { 
        try { n.root.getChildren().forEach(c=>c.dispose()); n.root.dispose(); } catch(e){} 
      }); 
      bombs.forEach(b => { 
        try{ b.dispose(); } catch(e){} 
      }); 
      cars.forEach(c => { 
        try{ 
          if (c.prompt) ui.removeControl(c.prompt); 
          c.root.getChildren().forEach(cc=>cc.dispose()); 
          c.root.dispose(); 
        }catch(e){} 
      });
      healthKitSpawns.forEach(spawn => {
  try { spawn.kit.dispose(); } catch(e) {}
});
      armorShops.forEach(s => {
        try { if (s.prompt) ui.removeControl(s.prompt); s.dispose(); } catch(e) {}
      });
    });
    
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());

  } catch (err) {
    console.error("Fatal script error:", err);
    const el = document.createElement("div");
    el.style.position = "absolute"; el.style.left = "12px"; el.style.top = "12px"; el.style.zIndex = 99999;
    el.style.padding = "8px 10px"; el.style.background = "rgba(0,0,0,0.6)"; el.style.color = "white"; el.style.borderRadius = "8px";
    el.style.fontFamily = "monospace"; el.style.fontSize = "12px";
    el.textContent = "Script error — open DevTools Console (F12).";
    document.body.appendChild(el);
  }
})();
</script>
</body>
</html>
